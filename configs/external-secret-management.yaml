# External Secret Store Configuration
# Configuration for managing secrets using external secret stores

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: todo-app
  annotations:
    # Use workload identity or similar for cloud providers
    iam.gke.io/gcp-service-account: external-secrets-gcp-sa@project-id.iam.gserviceaccount.com  # For GKE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["impersonate"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-binding
subjects:
- kind: ServiceAccount
  name: external-secrets-sa
  namespace: todo-app
roleRef:
  kind: ClusterRole
  name: external-secrets-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: operator.external-secrets.io/v1alpha1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: todo-app
spec:
  provider:
    vault:
      server: "https://vault.todo-app.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "todo-app"
---
apiVersion: operator.external-secrets.io/v1alpha1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: todo-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: todo-app
---
apiVersion: operator.external-secrets.io/v1alpha1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: todo-app
spec:
  provider:
    gcpsm:
      projectID: "todo-app-project"
      auth:
        workloadIdentity:
          clusterLocation: "us-central1"
          clusterName: "todo-app-cluster"
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: operator.external-secrets.io/v1alpha1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: ManagedIdentity
      vaultURL: "https://todo-app-vault.vault.azure.net"
      tenantId: "tenant-id"
---
# Example secret definitions using external secret stores
---
apiVersion: external-secrets.io/v1beta1
kind: SecretProviderClass
metadata:
  name: todo-app-secrets
  namespace: todo-app
spec:
  provider: vault
  parameters:
    roleName: "todo-app-role"
    path: "todo-app"
    version: "v2"
  objects:
  - objectName: "db-password"
    remoteRef:
      key: "database"
      property: "password"
  - objectName: "api-key"
    remoteRef:
      key: "external-api"
      property: "key"
  - objectName: "jwt-secret"
    remoteRef:
      key: "auth"
      property: "jwt-secret"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: todo-app-db-secret
  namespace: todo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: todo-app-db-secret
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: todo-app/database
      property: username
  - secretKey: password
    remoteRef:
      key: todo-app/database
      property: password
  - secretKey: host
    remoteRef:
      key: todo-app/database
      property: host
  - secretKey: port
    remoteRef:
      key: todo-app/database
      property: port
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: todo-app-api-keys
  namespace: todo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: todo-app-api-keys
    creationPolicy: Owner
  data:
  - secretKey: external-api-key
    remoteRef:
      key: todo-app/external-api-keys
      property: key
  - secretKey: external-api-secret
    remoteRef:
      key: todo-app/external-api-keys
      property: secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: todo-app-jwt-config
  namespace: todo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: todo-app-jwt-config
    creationPolicy: Owner
  data:
  - secretKey: jwt-secret
    remoteRef:
      key: todo-app-jwt-secret
      property: secret
  - secretKey: jwt-expiry
    remoteRef:
      key: todo-app-jwt-config
      property: expiry
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: todo-app-tls-certs
  namespace: todo-app
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: todo-app-tls-certs
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: todo-app-tls-cert
      property: certificate
  - secretKey: tls.key
    remoteRef:
      key: todo-app-tls-cert
      property: privateKey
---
# RBAC for External Secrets Operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
rules:
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets", "secretstores", "clustersecretstores"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets/status", "secretstores/status", "clustersecretstores/status"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-controller
subjects:
- kind: ServiceAccount
  name: external-secrets-sa
  namespace: todo-app
roleRef:
  kind: ClusterRole
  name: external-secrets-controller
  apiGroup: rbac.authorization.k8s.io