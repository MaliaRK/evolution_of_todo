# Service Account Token Authentication Configuration
# Configuration for service account token authentication in the Todo AI system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-app-sa
  namespace: todo-app
  annotations:
    # Enable automatic token mounting
    "automount-service-account-token": "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-runtime-sa
  namespace: dapr-system
  annotations:
    # Enable automatic token mounting for Dapr
    "automount-service-account-token": "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-operator-sa
  namespace: kafka
  annotations:
    # Enable automatic token mounting for Kafka
    "automount-service-account-token": "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-sa
  namespace: monitoring
  annotations:
    # Enable automatic token mounting for monitoring
    "automount-service-account-token": "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: todo-app
  annotations:
    # Enable automatic token mounting for external secrets
    "automount-service-account-token": "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-app-token-secret
  namespace: todo-app
  annotations:
    kubernetes.io/service-account.name: todo-app-sa
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: dapr-runtime-token-secret
  namespace: dapr-system
  annotations:
    kubernetes.io/service-account.name: dapr-runtime-sa
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-operator-token-secret
  namespace: kafka
  annotations:
    kubernetes.io/service-account.name: kafka-operator-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-reviewer
  namespace: todo-app
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-reviewer-binding
  namespace: todo-app
subjects:
- kind: ServiceAccount
  name: todo-app-sa
  namespace: todo-app
roleRef:
  kind: Role
  name: token-reviewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: token-auth-config
  namespace: todo-app
data:
  # Configuration for token-based authentication
  auth-config.yaml: |
    auth:
      enabled: true
      method: service-account-token
      token-path: /var/run/secrets/kubernetes.io/serviceaccount/token
      ca-cert-path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      audience: api
      issuer: kubernetes/serviceaccount
      validation:
        enabled: true
        skip-hostname-verification: false
        insecure-skip-tls-verify: false
      cache:
        enabled: true
        ttl: 5m
        max-size: 1000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-token-config
  namespace: dapr-system
data:
  # Dapr configuration for token authentication
  config.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Configuration
    metadata:
      name: dapr-config
    spec:
      tracing:
        samplingRate: "1"
        zipkin:
          endpointAddress: "http://jaeger:9411/api/v2/spans"
      mtls:
        enabled: true
        workloadCertTTL: "24h"
        allowedClockSkew: "15m"
      secrets:
        scopes:
        - storeName: kubernetes
          defaultAccess: allow
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: token-validator
webhooks:
- name: token-validator.todo-app.svc
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["pods"]
    scope: "Namespaced"
  clientConfig:
    service:
      name: todo-app-service
      namespace: todo-app
      path: /validate-token
    caBundle: Cg==
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  timeoutSeconds: 5
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: token-injector
webhooks:
- name: token-injector.todo-app.svc
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
    scope: "Namespaced"
  clientConfig:
    service:
      name: todo-app-service
      namespace: todo-app
      path: /inject-token
    caBundle: Cg==
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  timeoutSeconds: 5
  # Inject service account token into pod
  reinvocationPolicy:IfNeeded
---
apiVersion: v1
kind: Service
metadata:
  name: token-auth-service
  namespace: todo-app
spec:
  selector:
    app: token-auth-validator
  ports:
    - protocol: TCP
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-auth-validator
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-auth-validator
  template:
    metadata:
      labels:
        app: token-auth-validator
    spec:
      serviceAccountName: todo-app-sa
      containers:
      - name: validator
        image: gcr.io/kuar-demo/kuard-amd64:1
        ports:
        - containerPort: 8443
        env:
        - name: SERVICE_ACCOUNT_TOKEN
          valueFrom:
            secretKeyRef:
              name: todo-app-token-secret
              key: token
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: todo-app-tls-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: token-audience-config
  namespace: todo-app
data:
  # Configuration for token audience validation
  audience-config.json: |
    {
      "audiences": [
        "https://kubernetes.default.svc.cluster.local",
        "https://kubernetes.default.svc",
        "kubernetes.default.svc",
        "https://kubernetes.default.svc.cluster.local",
        "https://kubernetes.default.svc",
        "kubernetes.default.svc"
      ],
      "issuers": [
        "https://kubernetes.default.svc",
        "kubernetes/serviceaccount"
      ],
      "username_claim": "kubernetes.io/serviceaccount/name",
      "groups_claim": "kubernetes.io/serviceaccount/namespace"
    }
---
# Pod Security Policy to enforce token usage
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: token-required-psp
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: token-required-psp-role
rules:
- apiGroups: ['policy']
  resources: ['podsecuritypolicies']
  verbs:     ['use']
  resourceNames:
  - token-required-psp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: token-required-psp-binding
subjects:
- kind: ServiceAccount
  name: todo-app-sa
  namespace: todo-app
- kind: ServiceAccount
  name: dapr-runtime-sa
  namespace: dapr-system
- kind: ServiceAccount
  name: kafka-operator-sa
  namespace: kafka
roleRef:
  kind: ClusterRole
  name: token-required-psp-role
  apiGroup: rbac.authorization.k8s.io