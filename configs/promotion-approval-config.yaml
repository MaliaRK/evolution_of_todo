# Environment Promotion and Approval Configuration
# Configuration for promotion gates and approval processes in the CI/CD pipeline

# Promotion Gates
PROMOTION_GATES:
  DEVELOPMENT_TO_STAGING:
    # Gates for promoting from development to staging
    required_checks:
      - unit_tests_passed
      - integration_tests_passed
      - code_quality_score > 80
      - security_scan_passed
      - dependency_scan_passed
      - code_review_completed
      - documentation_updated
    
    automated_promotion: true
    approval_required: false
    notification_recipients:
      - dev-team@todo-app.com
    
    rollback_procedure: automatic_if_failure

  STAGING_TO_PRODUCTION:
    # Gates for promoting from staging to production
    required_checks:
      - all_tests_passed_in_staging
      - performance_tests_passed
      - security_audits_passed
      - compliance_checks_passed
      - manual_qa_signoff
      - business_approval
      - change_management_ticket_linked
    
    automated_promotion: false
    approval_required: true
    required_approvals:
      - dev_lead: 1
      - security_officer: 1
      - product_manager: 1
    
    notification_recipients:
      - dev-team@todo-app.com
      - ops-team@todo-app.com
      - product-team@todo-app.com
    
    rollback_procedure: manual_with_approval
    approval_timeout: 72  # hours

# Approval Workflow
APPROVAL_WORKFLOW:
  # Types of approvals
  approval_types:
    CODE_REVIEW:
      required_reviews: 2
      required_approvals: 1
      reviewers:
        - team_leads
        - security_specialists
        - domain_experts
    
    SECURITY_AUDIT:
      required_approvals: 1
      approvers:
        - security_officer
        - dev_sec_ops_team
      
    BUSINESS_APPROVAL:
      required_approvals: 1
      approvers:
        - product_manager
        - business_analyst
    
    OPERATIONS_APPROVAL:
      required_approvals: 1
      approvers:
        - devops_engineer
        - site_reliability_engineer

  # Approval process
  process:
    steps:
      - code_review: required_before_merge
      - security_audit: required_before_production
      - business_approval: required_before_production
      - operations_approval: required_before_production
    
    escalation_policy:
      timeout_hours: 24
      escalate_to: manager
      notification_on_escalation: true

# Environment Configuration
ENVIRONMENTS:
  DEVELOPMENT:
    # Development environment settings
    auto_deploy: true
    test_requirements: minimal
    approval_needed: none
    rollback_strategy: automatic
    monitoring: basic
    
  STAGING:
    # Staging environment settings
    auto_deploy: true
    test_requirements: comprehensive
    approval_needed: automated_gates
    rollback_strategy: automatic
    monitoring: full
    notification_on_deploy: true
    
  PRODUCTION:
    # Production environment settings
    auto_deploy: false
    test_requirements: exhaustive
    approval_needed: manual_with_gates
    rollback_strategy: manual_with_approval
    monitoring: enhanced
    notification_on_deploy: true
    maintenance_window_required: false
    business_hours_deploy_only: true

# Deployment Windows
DEPLOYMENT_WINDOWS:
  PRODUCTION:
    # Allowed deployment windows for production
    weekdays:
      allowed: true
      start_time: "09:00"
      end_time: "17:00"
      timezone: "UTC"
    
    weekends:
      allowed: false
    
    holidays:
      allowed: false
      exceptions:
        - emergency_fixes
        - security_patches
    
    blackout_periods:
      - "Dec 24 - Jan 2"  # Holiday season
      - "Easter weekend"
      - company_specific_events

# Rollback Configuration
ROLLBACK_CONFIG:
  TRIGGERS:
    # Conditions that trigger automatic rollback
    automatic_rollback_triggers:
      - deployment_failure
      - health_check_failure_within_minutes: 10
      - error_rate_above_threshold: 5%
      - response_time_above_threshold: 5000ms
      - availability_below_threshold: 95%
    
    manual_rollback_triggers:
      - business_request
      - security_incident
      - performance_issue
    
  ROLLBACK_PROCESS:
    # Steps for rollback
    steps:
      - stop_new_traffic
      - switch_to_previous_version
      - verify_rollback_success
      - resume_normal_operations
    
    timeout: 30  # minutes
    notification_on_rollback: true
    incident_creation_on_rollback: true

# Change Management
CHANGE_MANAGEMENT:
  # Integration with change management systems
  ticket_required: true
  ticket_template: production_deployment
  approval_hierarchy:
    low_risk:
      approval_level: team_lead
      notification: dev_team
    medium_risk:
      approval_level: manager
      notification: extended_team
    high_risk:
      approval_level: director
      notification: stakeholders
  
  # Risk assessment
  risk_assessment:
    factors:
      - customer_impact
      - system_complexity
      - dependency_changes
      - security_implications
      - performance_impact
    
    scoring:
      low: 1-3
      medium: 4-6
      high: 7-10

# Compliance and Audit
COMPLIANCE_CHECKS:
  # Required compliance checks
  required_checks:
    - security_scan
    - license_compliance
    - regulatory_compliance
    - internal_policies
  
  audit_trail:
    enabled: true
    fields:
      - who
      - what
      - when
      - where
      - why
      - approval_chain
    retention_period: 7 years

# Monitoring and Observability
MONITORING_REQUIREMENTS:
  # Monitoring requirements for each environment
  staging:
    - basic_health_checks
    - performance_monitoring
    - error_tracking
  
  production:
    - comprehensive_monitoring
    - real_user_monitoring
    - synthetic_monitoring
    - business_metric_tracking
    - alerting_setup
    - dashboard_configuration

# Notification Configuration
NOTIFICATIONS:
  # Notification settings for promotions
  channels:
    - email
    - slack
    - pagerduty
    - github_status_checks
  
  events:
    deployment_started:
      channels: [email, slack]
      recipients: [dev_team, ops_team]
    
    deployment_succeeded:
      channels: [email, slack]
      recipients: [dev_team, stakeholders]
    
    deployment_failed:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, ops_team, oncall]
    
    approval_requested:
      channels: [email, slack]
      recipients: [approvers]
    
    rollback_initiated:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, ops_team, oncall]