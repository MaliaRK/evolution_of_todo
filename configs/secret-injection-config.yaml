# Secret Injection Configuration
# Configuration for securely injecting secrets into the CI/CD pipeline

# Secret Providers
SECRET_PROVIDERS:
  GITHUB_SECRETS:
    # GitHub's built-in secret management
    enabled: true
    provider_type: github
    configuration:
      vault_integration: false
      encryption_at_rest: true
      access_logging: true
    supported_secrets:
      - api_keys
      - database_credentials
      - registry_credentials
      - cloud_provider_credentials

  HASHICORP_VAULT:
    # HashiCorp Vault integration
    enabled: false  # Enable in enterprise environments
    provider_type: hashicorp_vault
    configuration:
      address: https://vault.todo-app.com
      auth_method: github
      namespace: todo-app
      kv_version: 2
    supported_secrets:
      - all_application_secrets
      - infrastructure_credentials
      - certificates_and_keys

  AWS_SECRETS_MANAGER:
    # AWS Secrets Manager (for AWS deployments)
    enabled: false  # Enable when deploying to AWS
    provider_type: aws_secrets_manager
    configuration:
      region: us-west-2
      iam_role: ci-cd-secrets-access
    supported_secrets:
      - aws_credentials
      - rds_credentials
      - third_party_api_keys

  AZURE_KEY_VAULT:
    # Azure Key Vault (for Azure deployments)
    enabled: false  # Enable when deploying to Azure
    provider_type: azure_key_vault
    configuration:
      vault_name: todo-app-vault
      authentication: managed_identity
    supported_secrets:
      - azure_credentials
      - sql_server_credentials
      - storage_account_keys

# Secret Classification
SECRET_CLASSIFICATION:
  PUBLIC:
    # Information that can be logged or displayed
    examples:
      - environment_names
      - non-sensitive configuration
    handling: unrestricted
  
  INTERNAL:
    # Internal but non-sensitive information
    examples:
      - internal_api_urls
      - feature_flags
    handling: mask_in_logs
  
  CONFIDENTIAL:
    # Confidential but not critical information
    examples:
      - database_connection_strings
      - api_endpoint_urls
    handling: encrypt_in_transit, mask_in_logs
  
  SECRET:
    # Highly sensitive information
    examples:
      - passwords
      - api_keys
      - certificates
      - encryption_keys
    handling: encrypt_at_rest_and_transit, mask_in_logs, access_controlled
  
  CRITICAL:
    # Critical security information
    examples:
      - root_database_passwords
      - master_encryption_keys
      - admin_credentials
    handling: zero_access_logs, strict_acl, rotation_required

# Injection Methods
INJECTION_METHODS:
  ENVIRONMENT_VARIABLES:
    # Inject secrets as environment variables
    enabled: true
    prefix: TODO_APP_
    masking_enabled: true
    supported_scopes:
      - build_stage
      - test_stage
      - deployment_stage
    
    # Environment variable naming convention
    naming_convention: UPPERCASE_WITH_UNDERSCORES
    validation_rules:
      - no_spaces
      - alphanumeric_and_underscore_only
      - max_length: 255

  KUBERNETES_SECRETS:
    # Inject secrets as Kubernetes secrets
    enabled: true
    method: volume_mount
    mount_path: /etc/secrets
    permissions: 400
    supported_scopes:
      - deployment_stage
      - runtime
    
    # Secret mapping
    mapping:
      database_password: /etc/secrets/db-password
      api_key: /etc/secrets/api-key
      encryption_key: /etc/secrets/encryption-key

  CONFIGURATION_FILES:
    # Inject secrets into configuration files
    enabled: true
    method: template_substitution
    supported_formats:
      - yaml
      - json
      - properties
      - ini
    
    # File permissions
    permissions: 600
    backup_disabled: true
    audit_logging: true

# Security Controls
SECURITY_CONTROLS:
  # Controls to protect secrets
  access_control:
    principle_of_least_privilege: true
    role_based_access_control: true
    time_based_access: false  # Enable for temporary access
  
  encryption:
    at_rest: true
    in_transit: true
    key_rotation_interval: 90  # days
    hsm_support: false  # Enable for high-security environments
  
  monitoring:
    access_logging: true
    anomaly_detection: true
    unauthorized_access_alerts: true
    compliance_reporting: true
  
  validation:
    secret_format_validation: true
    expiration_date_check: true
    entropy_check: true
    dictionary_attack_check: true

# Pipeline Integration
PIPELINE_INTEGRATION:
  # How secrets are integrated into the pipeline
  build_stage:
    allowed_secret_types: [INTERNAL, CONFIDENTIAL]
    injection_method: environment_variables
    validation: required
  
  test_stage:
    allowed_secret_types: [INTERNAL]
    injection_method: environment_variables
    validation: required
  
  deployment_stage:
    allowed_secret_types: [CONFIDENTIAL, SECRET]
    injection_method: kubernetes_secrets
    validation: required
  
  runtime:
    allowed_secret_types: [SECRET, CRITICAL]
    injection_method: volume_mounts
    validation: required

# Rotation and Lifecycle
ROTATION_POLICY:
  # Secret rotation policies
  automatic_rotation:
    enabled: true
    intervals:
      api_keys: 90  # days
      database_passwords: 30  # days
      certificates: 180  # days
  
  manual_rotation:
    trigger_conditions:
      - security_incident
      - employee_departure
      - suspected_compromise
      - compliance_requirement
  
  lifecycle_management:
    creation_process: automated_with_approval
    activation_delay: 0  # hours
    deprecation_warning: 7  # days
    deletion_delay: 30  # days after deprecation

# Audit and Compliance
AUDIT_LOGGING:
  # Audit trail for secret access
  events_to_log:
    - secret_access
    - secret_modification
    - secret_rotation
    - failed_access_attempts
    - permission_changes
  
  log_retention: 7  # years
  log_encryption: true
  log_integrity: verified
  
  compliance_standards:
    - SOC2
    - ISO27001
    - GDPR
    - HIPAA  # If applicable

# Emergency Procedures
EMERGENCY_PROCEDURES:
  # Procedures for emergency secret handling
  emergency_rotation:
    trigger: security_incident
    approval_bypass: true
    notification_immediate: true
    affected_services_notification: true
  
  emergency_access:
    # Emergency access procedures
    break_glass_accounts: 2
    approval_required: 2_of_3
    time_limit: 4  # hours
    audit_logging_mandatory: true
  
  incident_response:
    # Response to secret-related incidents
    classification_process: automated
    escalation_procedure: documented
    remediation_steps: predefined
    post_incident_review: mandatory