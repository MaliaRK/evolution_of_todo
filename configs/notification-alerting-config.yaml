# Pipeline Notifications and Alerting Configuration
# Configuration for notifications and alerts in the CI/CD pipeline

# Notification Channels
NOTIFICATION_CHANNELS:
  EMAIL:
    enabled: true
    smtp_server: smtp.todo-app.com
    smtp_port: 587
    from_address: ci-cd@todo-app.com
    default_subject_prefix: "[Todo App CI/CD]"
    supported_templates:
      - build_status
      - deployment_status
      - approval_requests
      - security_alerts
      - performance_degradation
  
  SLACK:
    enabled: true
    webhook_url: ${SLACK_WEBHOOK_URL}
    channel_mapping:
      build_failures: "#ci-cd-alerts"
      deployments: "#deployment-notifications"
      security_issues: "#security-alerts"
      approvals: "#team-approvals"
    bot_name: "CI/CD Bot"
    icon_emoji: ":robot_face:"
  
  PAGERDUTY:
    enabled: true
    integration_key: ${PAGERDUTY_INTEGRATION_KEY}
    severity_levels:
      info: informational
      warning: warning
      error: error
      critical: critical
    auto_resolve: true
    escalation_policy: default
  
  GITHUB_STATUS_CHECKS:
    enabled: true
    context: "continuous-integration/ci-cd-pipeline"
    target_url: "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
    description: "CI/CD Pipeline Status"

# Notification Events
NOTIFICATION_EVENTS:
  BUILD_EVENTS:
    build_started:
      channels: [email]
      recipients: [commit_author]
      condition: always
    
    build_succeeded:
      channels: [email, slack]
      recipients: [commit_author, team]
      condition: always
    
    build_failed:
      channels: [email, slack, pagerduty]
      recipients: [commit_author, oncall, dev_team]
      condition: always
    
    build_unstable:
      channels: [email, slack]
      recipients: [commit_author, dev_team]
      condition: error_rate > 5%

  DEPLOYMENT_EVENTS:
    deployment_started:
      channels: [slack]
      recipients: [dev_team, ops_team]
      condition: environment != development
    
    deployment_succeeded:
      channels: [email, slack]
      recipients: [dev_team, stakeholders]
      condition: environment != development
    
    deployment_failed:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, ops_team, oncall]
      condition: always
    
    rollback_initiated:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, ops_team, oncall]
      condition: always

  SECURITY_EVENTS:
    security_scan_failed:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, security_team, oncall]
      condition: critical_vulnerability_found
    
    dependency_vulnerability:
      channels: [email, slack]
      recipients: [dev_team, security_team]
      condition: cvss_score > 7.0
    
    secrets_detected:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, security_team, oncall]
      condition: always

  PERFORMANCE_EVENTS:
    performance_degradation:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, ops_team, oncall]
      condition: response_time_increase > 50%
    
    resource_exhaustion:
      channels: [email, slack, pagerduty]
      recipients: [dev_team, ops_team, oncall]
      condition: cpu_usage > 90% OR memory_usage > 90%

# Alert Severity Levels
ALERT_SEVERITY_LEVELS:
  INFO:
    level: 0
    description: "Informational messages"
    notification_method: email
    escalation: none
    response_time: none
  
  WARNING:
    level: 1
    description: "Potential issues that need attention"
    notification_method: email, slack
    escalation: after_30_minutes
    response_time: 4_hours
  
  ERROR:
    level: 2
    description: "Errors that affect functionality"
    notification_method: email, slack
    escalation: after_10_minutes
    response_time: 1_hour
  
  CRITICAL:
    level: 3
    description: "Critical issues requiring immediate attention"
    notification_method: email, slack, pagerduty
    escalation: immediately
    response_time: 15_minutes

# Escalation Policies
ESCALATION_POLICIES:
  DEFAULT_ESCALATION:
    level_1:
      recipients: [primary_oncall]
      method: pagerduty
      timeout: 15  # minutes
    level_2:
      recipients: [secondary_oncall, dev_lead]
      method: pagerduty, phone_call
      timeout: 30  # minutes
    level_3:
      recipients: [manager, director]
      method: phone_call
      timeout: 60  # minutes

  SILENCING_RULES:
    # Rules for silencing alerts during maintenance
    maintenance_windows:
      enabled: true
      schedule: "02:00-04:00 UTC daily"
      affected_alerts: [performance, resource_usage]
    
    known_issues:
      enabled: true
      issue_tracker_integration: true
      auto_silence_duration: 24  # hours

# Notification Templates
NOTIFICATION_TEMPLATES:
  BUILD_STATUS_TEMPLATE:
    subject: "${status_icon} Build #${build_number} ${status} for ${branch}"
    body: |
      Build #${build_number} ${status} for branch ${branch}
      
      Commit: ${commit_sha} - ${commit_message}
      Author: ${commit_author}
      Duration: ${build_duration}
      
      Triggered by: ${trigger_user}
      Pipeline: ${pipeline_name}
      
      View details: ${build_url}
  
  DEPLOYMENT_STATUS_TEMPLATE:
    subject: "${status_icon} Deployment to ${environment} ${status}"
    body: |
      Deployment to ${environment} ${status}
      
      Release: ${release_version}
      Commit: ${commit_sha}
      Deployed by: ${deploy_user}
      
      Started: ${start_time}
      Completed: ${end_time}
      Duration: ${duration}
      
      Affected services: ${affected_services}
      
      View details: ${deployment_url}
  
  SECURITY_ALERT_TEMPLATE:
    subject: "🚨 Security Alert: ${severity} - ${issue_type}"
    body: |
      Security Alert
      Severity: ${severity}
      Issue Type: ${issue_type}
      Detected: ${timestamp}
      
      Description: ${description}
      Affected Component: ${component}
      CVSS Score: ${cvss_score}
      
      Recommendation: ${recommendation}
      Remediation Steps: ${remediation_steps}
      
      View details: ${security_dashboard_url}

# On-Call Configuration
ON_CALL_CONFIGURATION:
  # On-call schedule and rotation
  schedule:
    primary: weekly_rotation
    secondary: weekly_rotation
    overlap: 24  # hours
  
  on_call_tools:
    pagerduty: enabled
    ops_genie: disabled
    victor_ops: disabled
  
  on_call_responsibilities:
    - acknowledge_alerts_within_15_minutes
    - investigate_critical_issues_immediately
    - coordinate_with_dev_team_for_resolution
    - update_incident_status_regularly

# Compliance and Audit
COMPLIANCE_MONITORING:
  # Compliance requirements for notifications
  audit_trail:
    enabled: true
    fields:
      - timestamp
      - recipient
      - channel
      - message_content_hash
      - delivery_status
      - acknowledgment_status
    
    retention_period: 7  # years
  
  regulatory_compliance:
    gdpr_compliant: true
    data_minimization: true
    consent_management: required_for_sensitive_data

# Notification Preferences
USER_PREFERENCES:
  # Individual user preferences for notifications
  preference_storage:
    location: user_profile
    encryption: true
    access_control: user_specific
  
  default_preferences:
    email_notifications: true
    slack_notifications: true
    pagerduty_notifications: false  # Only for on-call personnel
  
  opt_out_options:
    temporary_silence: available
    permanent_opt_out: manager_approval_required
    vacation_mode: available_with_duration

# Monitoring and Analytics
MONITORING_METRICS:
  # Metrics for notification effectiveness
  delivery_metrics:
    - delivery_success_rate
    - average_delivery_time
    - channel_utilization
  
  engagement_metrics:
    - open_rates
    - click_through_rates
    - acknowledgment_times
    - resolution_times
  
  effectiveness_metrics:
    - mean_time_to_acknowledge
    - mean_time_to_resolve
    - false_positive_rate
    - alert_fatigue_indicators