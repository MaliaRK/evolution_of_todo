# Chaos Engineering Configuration
# Configuration for chaos engineering and resilience testing

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-experiments
  namespace: todo-app
data:
  # Chaos experiments for Todo AI system
  network-chaos.yaml: |
    # Network chaos experiment
    apiVersion: litmuschaos.io/v1alpha1
    kind: ChaosEngine
    metadata:
      name: todo-app-network-chaos
      namespace: todo-app
    spec:
      appinfo:
        appns: todo-app
        applabel: "app=todo-app"
        appkind: deployment
      engineState: active
      chaosServiceAccount: litmus-admin
      experiments:
      - name: pod-network-loss
        spec:
          components:
            env:
            # Network packet loss percentage
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: '50'
            # Duration of chaos in seconds
            - name: TOTAL_CHAOS_DURATION
              value: '60'
            # Network interface
            - name: NETWORK_INTERFACE
              value: 'eth0'
            # Chaos interval
            - name: CHAOS_INTERVAL
              value: '10'
            # Ramp time
            - name: RAMP_TIME
              value: '30'
  pod-chaos.yaml: |
    # Pod chaos experiment
    apiVersion: litmuschaos.io/v1alpha1
    kind: ChaosEngine
    metadata:
      name: todo-app-pod-chaos
      namespace: todo-app
    spec:
      appinfo:
        appns: todo-app
        applabel: "app=todo-app"
        appkind: deployment
      engineState: active
      chaosServiceAccount: litmus-admin
      experiments:
      - name: pod-delete
        spec:
          components:
            env:
            # Number of pods to delete
            - name: CHAOS_INTERVAL
              value: '10'
            # Total chaos duration
            - name: TOTAL_CHAOS_DURATION
              value: '60'
            # Force deletion
            - name: FORCE
              value: 'true'
            # Ramp time
            - name: RAMP_TIME
              value: '30'
  stress-chaos.yaml: |
    # Stress chaos experiment
    apiVersion: litmuschaos.io/v1alpha1
    kind: ChaosEngine
    metadata:
      name: todo-app-stress-chaos
      namespace: todo-app
    spec:
      appinfo:
        appns: todo-app
        applabel: "app=todo-app"
        appkind: deployment
      engineState: active
      chaosServiceAccount: litmus-admin
      experiments:
      - name: pod-cpu-hog
        spec:
          components:
            env:
            # CPU percentage to consume
            - name: CPU_CORES
              value: '1'
            # Duration of chaos in seconds
            - name: TOTAL_CHAOS_DURATION
              value: '60'
            # Chaos interval
            - name: CHAOS_INTERVAL
              value: '10'
            # Stress-ng arguments
            - name: STRESS_NG_ARGS
              value: '--cpu 1 --timeout 60s'
            # Ramp time
            - name: RAMP_TIME
              value: '30'
      - name: pod-memory-hog
        spec:
          components:
            env:
            # Memory to consume
            - name: MEMORY_CONSUMPTION_PERCENTAGE
              value: '80'
            # Duration of chaos in seconds
            - name: TOTAL_CHAOS_DURATION
              value: '60'
            # Chaos interval
            - name: CHAOS_INTERVAL
              value: '10'
            # Stress-ng arguments
            - name: STRESS_NG_ARGS
              value: '--vm 1 --vm-bytes 500M --timeout 60s'
            # Ramp time
            - name: RAMP_TIME
              value: '30'
  dapr-chaos.yaml: |
    # Dapr chaos experiment
    apiVersion: litmuschaos.io/v1alpha1
    kind: ChaosEngine
    metadata:
      name: dapr-chaos
      namespace: dapr-system
    spec:
      appinfo:
        appns: dapr-system
        applabel: "app=dapr-sidecar-injector"
        appkind: deployment
      engineState: active
      chaosServiceAccount: litmus-admin
      experiments:
      - name: pod-delete
        spec:
          components:
            env:
            # Chaos interval
            - name: CHAOS_INTERVAL
              value: '15'
            # Total chaos duration
            - name: TOTAL_CHAOS_DURATION
              value: '90'
            # Force deletion
            - name: FORCE
              value: 'false'
            # Ramp time
            - name: RAMP_TIME
              value: '30'
  kafka-chaos.yaml: |
    # Kafka chaos experiment
    apiVersion: litmuschaos.io/v1alpha1
    kind: ChaosEngine
    metadata:
      name: kafka-chaos
      namespace: kafka
    spec:
      appinfo:
        appns: kafka
        applabel: "app=kafka"
        appkind: statefulset
      engineState: active
      chaosServiceAccount: litmus-admin
      experiments:
      - name: pod-delete
        spec:
          components:
            env:
            # Chaos interval
            - name: CHAOS_INTERVAL
              value: '20'
            # Total chaos duration
            - name: TOTAL_CHAOS_DURATION
              value: '120'
            # Force deletion
            - name: FORCE
              value: 'false'
            # Ramp time
            - name: RAMP_TIME
              value: '30'
  chaos-schedule.yaml: |
    # Scheduled chaos experiments
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: weekly-chaos-experiment
      namespace: todo-app
    spec:
      schedule: "0 2 * * 1"  # Every Monday at 2 AM
      jobTemplate:
        spec:
          template:
            spec:
              serviceAccountName: litmus-admin
              containers:
              - name: chaos-runner
                image: litmuschaos/chaos-runner:latest
                env:
                - name: CHAOS_NAMESPACE
                  value: "todo-app"
                - name: APP_LABEL
                  value: "app=todo-app"
                - name: CHAOS_KIND
                  value: "deployment"
                command:
                - /bin/bash
                - -c
                - |
                  # Run a series of chaos experiments
                  echo "Starting weekly chaos experiment"
                  
                  # Apply network chaos
                  kubectl apply -f /experiments/network-chaos.yaml
                  sleep 120
                  
                  # Apply pod chaos
                  kubectl apply -f /experiments/pod-chaos.yaml
                  sleep 120
                  
                  # Apply stress chaos
                  kubectl apply -f /experiments/stress-chaos.yaml
                  sleep 120
                  
                  # Clean up
                  kubectl delete chaosengine todo-app-network-chaos -n todo-app || true
                  kubectl delete chaosengine todo-app-pod-chaos -n todo-app || true
                  kubectl delete chaosengine todo-app-stress-chaos -n todo-app || true
                  
                  echo "Weekly chaos experiment completed"
                volumeMounts:
                - name: chaos-experiments
                  mountPath: /experiments
              volumes:
              - name: chaos-experiments
                configMap:
                  name: chaos-experiments
              restartPolicy: OnFailure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-monitoring
  namespace: todo-app
data:
  chaos-monitoring.yaml: |
    # Monitoring configuration for chaos experiments
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: chaos-monitoring-config
      namespace: monitoring
    data:
      prometheus-rules.yaml: |
        groups:
        - name: chaos-monitoring
          rules:
          - alert: HighErrorRateDuringChaos
            expr: increase(todo_app_http_requests_total{status=~"5.."}[5m]) > 100
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate during chaos experiment"
              description: "Error rate exceeded 100 requests in 5 minutes during chaos experiment"
          
          - alert: HighLatencyDuringChaos
            expr: histogram_quantile(0.95, rate(todo_app_http_request_duration_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High latency during chaos experiment"
              description: "95th percentile response time exceeded 2 seconds during chaos experiment"
          
          - alert: ServiceUnavailableDuringChaos
            expr: up{job="todo-app"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service unavailable during chaos experiment"
              description: "Todo app service became unavailable during chaos experiment"
