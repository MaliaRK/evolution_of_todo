# Horizontal Pod Autoscaler Configurations
# Advanced HPA configurations for production readiness

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todo-app-hpa
  namespace: todo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todo-app
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 5
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dapr-sidecar-hpa
  namespace: dapr-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dapr-sidecar-injector
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-hpa
  namespace: kafka
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: kafka
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Pods
    pods:
      metric:
        name: kafka_consumergroup_lag
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 10
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 30
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpa-behavior-config
  namespace: todo-app
data:
  hpa-behavior.yaml: |
    # Advanced HPA behavior configurations
    defaultBehavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
        selectPolicy: Min
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 5
          periodSeconds: 60
        selectPolicy: Max
    
    # Custom behavior for different workloads
    criticalWorkloadBehavior:
      scaleDown:
        stabilizationWindowSeconds: 180
        policies:
        - type: Percent
          value: 5
          periodSeconds: 60
        selectPolicy: Max
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 10
          periodSeconds: 60
        selectPolicy: Max
    
    batchWorkloadBehavior:
      scaleDown:
        stabilizationWindowSeconds: 120
        policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        selectPolicy: Max
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
        - type: Pods
          value: 50
          periodSeconds: 60
        selectPolicy: Max
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: todo-app-vpa
  namespace: todo-app
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todo-app
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: todo-app
      maxAllowed:
        cpu: 2000m
        memory: 4Gi
      minAllowed:
        cpu: 100m
        memory: 128Mi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
      mode: Auto
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: todo-app-pdb
  namespace: todo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: todo-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscaling-best-practices
  namespace: todo-app
data:
  best-practices.md: |
    # HPA Best Practices
    
    ## Resource Requests and Limits
    - Always set CPU and memory requests for proper scaling
    - Set limits to prevent resource exhaustion
    - Monitor actual usage vs. requests to optimize settings
    
    ## Scaling Behavior
    - Use `behavior` field to customize scaling policies
    - Prevent thrashing with appropriate stabilization windows
    - Configure different policies for scale-up and scale-down
    
    ## Multiple Metrics
    - Combine resource and custom metrics for better scaling decisions
    - Use external metrics for queue-based scaling
    - Consider business metrics in addition to technical metrics
    
    ## Testing
    - Test scaling behavior under different load patterns
    - Monitor scaling events and adjust thresholds as needed
    - Validate that applications can handle scaled instances properly