apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-role
  namespace: monitoring
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-rolebinding
  namespace: monitoring
subjects:
- kind: ServiceAccount
  name: benchmark-sa
  namespace: monitoring
roleRef:
  kind: Role
  name: benchmark-role
  apiGroup: rbac.authorization.k8s.io