# Performance Benchmarking Procedures
# Configuration for performance benchmarking in the Todo AI system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: performance-benchmarking-config
  namespace: todo-app
data:
  benchmarking-tools.yaml: |
    # Performance benchmarking tools configuration
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: benchmarking-tools-config
      namespace: monitoring
    data:
      wrk-config.lua: |
        -- wrk configuration for Todo App benchmarking
        local counter = 0
        local threads = {}
        
        function setup(thread)
          thread:set("id", counter)
          counter = counter + 1
          threads[counter] = thread
        end
        
        function init(args)
          local thread = {id = tonumber(args[1])}
          math.randomseed(os.time() + thread.id)
        end
        
        function request()
          local path = "/api/v1/tasks"
          local headers = {}
          headers["Content-Type"] = "application/json"
          headers["User-Agent"] = "Todo-App-Benchmark/1.0"
          headers["X-Request-ID"] = math.random(100000, 999999)
          
          return wrk.format("GET", path, headers)
        end
        
        function response(status, headers, body)
          -- Process response
          if status ~= 200 then
            print("Non-200 response: " .. status)
          end
        end
      jmeter-config.jmx: |
        <?xml version="1.0" encoding="UTF-8"?>
        <jmeterTestPlan version="1.2" properties="5.0" jmeter="5.4.1">
          <hashTree>
            <TestPlan guiclass="TestPlanGui" testclass="TestPlan" testname="Todo App Performance Test">
              <elementProp name="TestPlan.arguments" elementType="Arguments" guiclass="ArgumentsPanel" testclass="Arguments">
