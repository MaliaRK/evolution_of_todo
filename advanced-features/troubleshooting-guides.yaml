# Production Troubleshooting Guides
# Comprehensive troubleshooting guides for production environments

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: troubleshooting-guides
  namespace: todo-app
data:
  troubleshooting-guides.md: |
    # Production Troubleshooting Guides
    
    ## Table of Contents
    1. [Overview](#overview)
    2. [Common Issues](#common-issues)
    3. [Diagnostic Procedures](#diagnostic-procedures)
    4. [Resolution Steps](#resolution-steps)
    5. [Monitoring and Alerting](#monitoring-and-alerting)
    6. [Communication Protocols](#communication-protocols)
    7. [Post-Incident Procedures](#post-incident-procedures)
    
    ## Overview
    
    This document provides comprehensive troubleshooting guides for the Todo AI system in production environments. It covers common issues, diagnostic procedures, and resolution steps to minimize downtime and maintain service availability.
    
    ## Common Issues
    
    ### 1. Application Performance Issues
    
    #### Symptoms
    - Slow response times
    - High latency
    - Timeouts
    - Increased error rates
    
    #### Potential Causes
    - Resource exhaustion (CPU, memory, disk)
    - Database performance issues
    - Network congestion
    - Third-party service dependencies
    - Code inefficiencies
    
    #### Diagnostic Steps
    1. Check application logs for errors
    2. Monitor resource utilization
    3. Analyze database query performance
    4. Review external service dependencies
    5. Examine application metrics
    
    ### 2. Service Unavailability
    
    #### Symptoms
    - Service returns 5xx errors
    - Service is completely unreachable
    - Health checks failing
    - Load balancer marking instances as unhealthy
    
    #### Potential Causes
    - Application crashes
    - Node failures
    - Network issues
    - Configuration errors
    - Resource limits exceeded
    
    #### Diagnostic Steps
    1. Check pod status and events
    2. Review application logs
    3. Verify service configuration
    4. Check node health
    5. Examine network policies
    
    ### 3. Data Consistency Issues
    
    #### Symptoms
    - Inconsistent data across services
    - Missing or duplicate records
    - Failed transactions
    - Cache inconsistencies
    
    #### Potential Causes
    - Race conditions
    - Transaction failures
    - Cache invalidation issues
    - Database replication problems
    - Message ordering issues
    
    #### Diagnostic Steps
    1. Check database logs
    2. Review transaction logs
    3. Verify cache consistency
    4. Examine message queues
    5. Analyze data flow patterns
    
    ## Diagnostic Procedures
    
    ### 1. Initial Assessment
    
    ```bash
    # Check overall cluster status
    kubectl get nodes
    kubectl get pods --all-namespaces
    kubectl get events --all-namespaces --sort-by='.lastTimestamp'
    
    # Check specific application status
    kubectl get pods -n todo-app
    kubectl get services -n todo-app
    kubectl get deployments -n todo-app
    kubectl get statefulsets -n todo-app
    ```
    
    ### 2. Pod Diagnostics
    
    ```bash
    # Get detailed pod information
    kubectl describe pod <pod-name> -n todo-app
    
    # Check pod logs
    kubectl logs <pod-name> -n todo-app
    kubectl logs <pod-name> -n todo-app --previous  # Previous instance logs
    
    # Check resource usage
    kubectl top pods -n todo-app
    
    # Execute commands in pod
    kubectl exec -it <pod-name> -n todo-app -- /bin/sh
    ```
    
    ### 3. Service Diagnostics
    
    ```bash
    # Check service endpoints
    kubectl get endpoints <service-name> -n todo-app
    
    # Test service connectivity
    kubectl run test-pod --image=busybox --rm -it --restart=Never -- nslookup <service-name>.todo-app.svc.cluster.local
    
    # Port forward to test service
    kubectl port-forward -n todo-app svc/<service-name> 8080:80
    ```
    
    ### 4. Network Diagnostics
    
    ```bash
    # Check network policies
    kubectl get networkpolicies -n todo-app
    
    # Test connectivity between services
    kubectl run test-pod --image=nicolaka/netshoot --rm -it --restart=Never -- /bin/bash
    ```
    
    ## Resolution Steps
    
    ### 1. Application Issues
    
    #### Restart Application
    ```bash
    # Restart specific deployment
    kubectl rollout restart deployment/<deployment-name> -n todo-app
    
    # Check rollout status
    kubectl rollout status deployment/<deployment-name> -n todo-app
    ```
    
    #### Scale Application
    ```bash
    # Scale deployment
    kubectl scale deployment/<deployment-name> --replicas=<new-count> -n todo-app
    
    # Check HPA status
    kubectl get hpa -n todo-app
    ```
    
    ### 2. Resource Issues
    
    #### Check Resource Limits
    ```bash
    # Check resource quotas
    kubectl describe resourcequota -n todo-app
    
    # Check pod resource usage
    kubectl top pods -n todo-app
    ```
    
    #### Update Resource Limits
    ```bash
    # Patch deployment resource limits
    kubectl patch deployment/<deployment-name> -n todo-app -p '{"spec":{"template":{"spec":{"containers":[{"name":"<container-name>","resources":{"requests":{"cpu":"200m","memory":"256Mi"},"limits":{"cpu":"500m","memory":"512Mi"}}}]}}}}'
    ```
    
    ### 3. Configuration Issues
    
    #### Check ConfigMaps and Secrets
    ```bash
    # Check ConfigMap
    kubectl get configmap <configmap-name> -n todo-app -o yaml
    
    # Check Secret
    kubectl get secret <secret-name> -n todo-app -o yaml
    ```
    
    #### Update Configuration
    ```bash
    # Update ConfigMap
    kubectl create configmap <configmap-name> --from-file=<path-to-config> -n todo-app --dry-run=client -o yaml | kubectl apply -f -
    
    # Restart pods to pick up new configuration
    kubectl rollout restart deployment/<deployment-name> -n todo-app
    ```
    
    ## Monitoring and Alerting
    
    ### Key Metrics to Monitor
    
    1. **Application Metrics**
       - Response time (P50, P95, P99)
       - Request rate
       - Error rate
       - Active users
    
    2. **Infrastructure Metrics**
       - CPU utilization
       - Memory utilization
       - Disk I/O
       - Network throughput
    
    3. **Business Metrics**
       - Task completion rate
       - User engagement
       - Conversion rates
    
    ### Alerting Thresholds
    
    1. **Critical Alerts**
       - Service unavailable (5xx errors > 5%)
       - Response time > 5s (P95)
       - System down
       - Database unavailable
    
    2. **Warning Alerts**
       - Response time > 2s (P95)
       - Error rate > 1%
       - CPU utilization > 80%
       - Memory utilization > 85%
    
    3. **Info Alerts**
       - Deployment events
       - Configuration changes
       - Scaling events
    
    ## Communication Protocols
    
    ### Incident Classification
    
    1. **Level 1 (Minor)**
       - Impact: Individual users
       - Response time: Within 4 hours
       - Communication: Internal team
    
    2. **Level 2 (Moderate)**
       - Impact: Multiple users or services
       - Response time: Within 1 hour
       - Communication: Internal team + management
    
    3. **Level 3 (Major)**
       - Impact: Significant user base or critical functionality
       - Response time: Within 30 minutes
       - Communication: Internal team + management + customers
    
    4. **Level 4 (Critical)**
       - Impact: Complete service outage or security breach
       - Response time: Within 15 minutes
       - Communication: Full team + management + customers + executives
    
    ### Communication Channels
    
    - **Slack**: #production-incidents
    - **PagerDuty**: For critical alerts
    - **Email**: For customer-facing incidents
    - **Status Page**: For public incident communication
    
    ## Post-Incident Procedures
    
    ### 1. Incident Documentation
    
    Document the incident with the following details:
    - Timeline of events
    - Root cause analysis
    - Resolution steps taken
    - Impact assessment
    - Lessons learned
    
    ### 2. Root Cause Analysis
    
    Conduct a thorough root cause analysis using:
    - The "5 Whys" technique
    - Fishbone diagrams
    - Timeline analysis
    - Contributing factors identification
    
    ### 3. Corrective Actions
    
    Define and implement corrective actions:
    - Process improvements
    - Technical fixes
    - Monitoring enhancements
    - Training requirements
    
    ### 4. Follow-up Review
    
    Schedule a follow-up review meeting to:
    - Review the incident response
    - Validate corrective actions
    - Update documentation
    - Share learnings with the team
  troubleshooting-scripts.yaml: |
    # Troubleshooting scripts for production
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: troubleshooting-scripts
      namespace: todo-app
    data:
      health-check.sh: |
        #!/bin/bash
        # Comprehensive health check script for Todo App
        
        set -e
        
        NAMESPACE="todo-app"
        APP_NAME="todo-app"
        
        echo "Starting health check for $APP_NAME in namespace $NAMESPACE"
        echo "=========================================================="
        
        # Check cluster status
        echo "1. Checking cluster status..."
        kubectl cluster-info
        echo ""
        
        # Check node status
        echo "2. Checking node status..."
        kubectl get nodes
        echo ""
        
        # Check application pods
        echo "3. Checking application pods..."
        kubectl get pods -n $NAMESPACE
        echo ""
        
        # Check pod status details
        echo "4. Checking pod status details..."
        kubectl describe pods -n $NAMESPACE
        echo ""
        
        # Check services
        echo "5. Checking services..."
        kubectl get services -n $NAMESPACE
        echo ""
        
        # Check deployments
        echo "6. Checking deployments..."
        kubectl get deployments -n $NAMESPACE
        echo ""
        
        # Check resource usage
        echo "7. Checking resource usage..."
        kubectl top pods -n $NAMESPACE || echo "Metrics server not available"
        echo ""
        
        # Check logs for errors
        echo "8. Checking recent logs for errors..."
        kubectl logs -n $NAMESPACE -l app=$APP_NAME --since=10m | grep -i error || echo "No errors found in last 10 minutes"
        echo ""
        
        # Check events
        echo "9. Checking recent events..."
        kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' --field-selector type!=Normal
        echo ""
        
        # Test service connectivity
        echo "10. Testing service connectivity..."
        SVC_NAME=$(kubectl get svc -n $NAMESPACE -l app=$APP_NAME -o jsonpath='{.items[0].metadata.name}')
        if [ ! -z "$SVC_NAME" ]; then
          kubectl run test-connectivity --image=busybox --rm -it --restart=Never --namespace=$NAMESPACE -- nslookup $SVC_NAME.$NAMESPACE.svc.cluster.local
        else
          echo "No service found with app=$APP_NAME label"
        fi
        echo ""
        
        echo "Health check completed!"
        echo "=========================================================="
      resource-troubleshooting.sh: |
        #!/bin/bash
        # Resource troubleshooting script
        
        set -e
        
        NAMESPACE="todo-app"
        
        echo "Resource troubleshooting for namespace: $NAMESPACE"
        echo "================================================"
        
        # Check resource quotas
        echo "1. Resource quotas:"
        kubectl describe resourcequota -n $NAMESPACE
        echo ""
        
        # Check limit ranges
        echo "2. Limit ranges:"
        kubectl describe limitrange -n $NAMESPACE
        echo ""
        
        # Check pod resource usage
        echo "3. Pod resource usage:"
        kubectl top pods -n $NAMESPACE || echo "Metrics server not available"
        echo ""
        
        # Check node resource usage
        echo "4. Node resource usage:"
        kubectl top nodes
        echo ""
        
        # Check for pods in pending state
        echo "5. Pending pods:"
        kubectl get pods -n $NAMESPACE --field-selector=status.phase=Pending
        echo ""
        
        # Check for pods with resource issues
        echo "6. Pods with resource issues:"
        kubectl describe pods -n $NAMESPACE --field-selector=status.phase!=Running,status.phase!=Succeeded | grep -A 5 -B 5 -i "resource\|limit\|quota"
        echo ""
        
        echo "Resource troubleshooting completed!"
        echo "================================================"
      network-troubleshooting.sh: |
        #!/bin/bash
        # Network troubleshooting script
        
        set -e
        
        NAMESPACE="todo-app"
        
        echo "Network troubleshooting for namespace: $NAMESPACE"
        echo "================================================"
        
        # Check network policies
        echo "1. Network policies:"
        kubectl get networkpolicies -n $NAMESPACE -o yaml
        echo ""
        
        # Check services and endpoints
        echo "2. Services and endpoints:"
        kubectl get svc,endpoints -n $NAMESPACE
        echo ""
        
        # Check ingress
        echo "3. Ingress resources:"
        kubectl get ingress -n $NAMESPACE
        echo ""
        
        # Check for connectivity issues
        echo "4. Testing connectivity..."
        kubectl run netshoot-debug --image=nicolaka/netshoot --rm -it --restart=Never --namespace=$NAMESPACE -- bash
        echo ""
        
        # Check DNS resolution
        echo "5. Testing DNS resolution..."
        kubectl run dns-test --image=busybox --rm -it --restart=Never --namespace=$NAMESPACE -- nslookup kubernetes.default.svc.cluster.local
        echo ""
        
        echo "Network troubleshooting completed!"
        echo "================================================"
  diagnostic-tools.yaml: |
    # Diagnostic tools configuration
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: diagnostic-tools
      namespace: todo-app
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: diagnostic-tools
      template:
        metadata:
          labels:
            app: diagnostic-tools
        spec:
          containers:
          - name: diagnostic-tools
            image: nicolaka/netshoot:latest
            command:
            - sleep
            - "3600"
            volumeMounts:
            - name: diagnostic-scripts
              mountPath: /scripts
            securityContext:
              privileged: true
          volumes:
          - name: diagnostic-scripts
            configMap:
              name: troubleshooting-scripts
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: diagnostic-tools-svc
      namespace: todo-app
    spec:
      selector:
        app: diagnostic-tools
      ports:
      - protocol: TCP
        port: 80
        targetPort: 80
      type: ClusterIP
