# Retry Mechanisms with Exponential Backoff
# Configuration for retry mechanisms with exponential backoff in service communications

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: retry-mechanisms-config
  namespace: todo-app
data:
  istio-retry-config.yaml: |
    # Istio retry configuration
    apiVersion: networking.istio.io/v1alpha3
    kind: VirtualService
    metadata:
      name: todo-app-retry-virtual-service
      namespace: todo-app
    spec:
      hosts:
      - todo-app.todo-app.svc.cluster.local
      http:
      - match:
        - headers:
            retry-policy:
              exact: "exponential-backoff"
        retries:
          attempts: 3
          perTryTimeout: 2s
          retryOn: "5xx,gateway-error,connect-failure,refused-stream"
        route:
        - destination:
            host: todo-app.todo-app.svc.cluster.local
            port:
              number: 80
      - retries:
          attempts: 5
          perTryTimeout: 3s
          retryOn: "5xx,gateway-error,connect-failure,refused-stream,retriable-status-codes"
        route:
        - destination:
            host: todo-app.todo-app.svc.cluster.local
            port:
              number: 80
    ---
    # Dapr service invocation retry configuration
    apiVersion: dapr.io/v1alpha1
    kind: Configuration
    metadata:
      name: dapr-retry-config
      namespace: dapr-system
    spec:
      serviceInvocation:
        retryPolicy:
          retryForever: false
          maxRetries: 3
          exponentialBackoff:
            baseDelay: 2s
            maxDelay: 30s
        timeout: 30s
      tracing:
        samplingRate: "1"
        zipkin:
          endpointAddress: "http://jaeger-collector:9411/api/v2/spans"
  dapr-retry-component.yaml: |
    # Dapr retry middleware component
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: retry-middleware
      namespace: todo-app
    spec:
      type: middleware.http.retry
      version: v1
      metadata:
      - name: maxRetries
        value: "5"
      - name: retryForever
        value: "false"
      - name: backoffPolicy
        value: "exponential"
      - name: backoffBaseDelay
        value: "2s"
      - name: backoffMaxDelay
        value: "60s"
      - name: retryHttpStatusCodes
        value: "500,502,503,504"
      - name: retryHttpMethods
        value: "GET,POST,PUT,PATCH"
    scopes:
    - todo-app
  application-retry-config.yaml: |
    # Application-level retry configuration
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: application-retry-config
      namespace: todo-app
    data:
      retry-config.properties: |
        # Retry configuration for Todo App
        # External API call retry settings
        retry.external.api.enabled=true
        retry.external.api.max.attempts=5
        retry.external.api.base.delay=1000
        retry.external.api.max.delay=30000
        retry.external.api.multiplier=2
        retry.external.api.supported.methods=GET,POST,PUT,PATCH,DELETE
        retry.external.api.status.codes=500,502,503,504,408,429
        
        # Database operation retry settings
        retry.database.enabled=true
        retry.database.max.attempts=3
        retry.database.base.delay=500
        retry.database.max.delay=10000
        retry.database.multiplier=2
        retry.database.status.codes=409,500,503
        
        # Message queue retry settings
        retry.message.queue.enabled=true
        retry.message.queue.max.attempts=10
        retry.message.queue.base.delay=1000
        retry.message.queue.max.delay=60000
        retry.message.queue.multiplier=2
        retry.message.queue.status.codes=500,503
        
        # Cache operation retry settings
        retry.cache.enabled=true
        retry.cache.max.attempts=3
        retry.cache.base.delay=250
        retry.cache.max.delay=5000
        retry.cache.multiplier=2
        retry.cache.status.codes=500,503
      retry-beans.xml: |
        <?xml version="1.0" encoding="UTF-8"?>
        <beans xmlns="http://www.springframework.org/schema/beans"
               xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xmlns:retry="http://www.springframework.org/schema/retry"
               xsi:schemaLocation="
                   http://www.springframework.org/schema/beans
                   http://www.springframework.org/schema/beans/spring-beans.xsd
                   http://www.springframework.org/schema/retry
                   http://www.springframework.org/schema/retry/spring-retry.xsd">
        
          <!-- Retry Template Configuration -->
          <bean id="retryTemplate" class="org.springframework.retry.support.RetryTemplate">
            <property name="retryPolicy">
              <bean class="org.springframework.retry.policy.SimpleRetryPolicy">
                <constructor-arg value="3"/>
              </bean>
            </property>
            <property name="backOffPolicy">
              <bean class="org.springframework.retry.backoff.ExponentialBackOffPolicy">
                <property name="initialInterval" value="1000"/>
                <property name="maxInterval" value="30000"/>
                <property name="multiplier" value="2"/>
              </bean>
            </property>
          </bean>
        
          <!-- External API Retry Configuration -->
          <bean id="externalApiRetryTemplate" class="org.springframework.retry.support.RetryTemplate">
            <property name="retryPolicy">
              <bean class="org.springframework.retry.policy.SimpleRetryPolicy">
                <constructor-arg value="5"/>
              </bean>
            </property>
            <property name="backOffPolicy">
              <bean class="org.springframework.retry.backoff.ExponentialBackOffPolicy">
                <property name="initialInterval" value="1000"/>
                <property name="maxInterval" value="60000"/>
                <property name="multiplier" value="2"/>
              </bean>
            </property>
          </bean>
        
          <!-- Database Retry Configuration -->
          <bean id="databaseRetryTemplate" class="org.springframework.retry.support.RetryTemplate">
            <property name="retryPolicy">
              <bean class="org.springframework.retry.policy.SimpleRetryPolicy">
                <constructor-arg value="3"/>
              </bean>
            </property>
            <property name="backOffPolicy">
              <bean class="org.springframework.retry.backoff.ExponentialBackOffPolicy">
                <property name="initialInterval" value="500"/>
                <property name="maxInterval" value="10000"/>
                <property name="multiplier" value="2"/>
              </bean>
            </property>
          </bean>
        </beans>
  nginx-retry-config.yaml: |
    # Nginx ingress retry configuration
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nginx-retry-config
      namespace: ingress-nginx
    data:
      nginx-configuration: |
        # Retry configuration for nginx ingress
        proxy_next_upstream: error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries: 3;
        proxy_next_upstream_timeout: 10s;
        
        # Custom retry headers
        add_header X-Retry-Count $upstream_response_time always;
        add_header X-Retry-Status $upstream_status always;
        
        # Upstream keepalive settings
        keepalive: 32;
        keepalive_requests: 100;
        keepalive_timeout: 60s;
      server-snippet.conf: |
        # Server snippet for retry headers
        location ~* "^/api/v1/.*$" {
          # Custom retry logic for API endpoints
          proxy_pass http://todo-app-active;
          
          # Retry settings
          proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
          proxy_next_upstream_tries 5;
          proxy_next_upstream_timeout 30s;
          
          # Add retry headers
          proxy_set_header X-Retry-Count $upstream_response_time;
          proxy_set_header X-Retry-Status $upstream_status;
        }
  retry-middleware.yaml: |
    # Custom retry middleware configuration
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: custom-retry-middleware
      namespace: todo-app
    data:
      retry-middleware.js: |
        // Custom retry middleware implementation
        const retryMiddleware = (options = {}) => {
          const {
            maxRetries = 3,
            baseDelay = 1000,
            maxDelay = 30000,
            multiplier = 2,
            statusCodes = [500, 502, 503, 504],
            shouldRetry = () => true
          } = options;
        
          return async (req, res, next) => {
            let attempt = 0;
            let lastError;
        
            while (attempt <= maxRetries) {
              try {
                // Add retry attempt header
                req.headers['X-Retry-Attempt'] = attempt;
                
                // Call the next middleware
                await next();
                
                // If successful, break out of loop
                if (res.statusCode < 500) {
                  return;
                }
              } catch (error) {
                lastError = error;
              }
        
              // Check if we should retry based on status code
              if (!statusCodes.includes(res.statusCode) || !shouldRetry(req, res)) {
                break;
              }
        
              attempt++;
        
              // Calculate delay with exponential backoff
              if (attempt <= maxRetries) {
                const delay = Math.min(baseDelay * Math.pow(multiplier, attempt - 1), maxDelay);
                await sleep(delay);
              }
            }
        
            // If we exhausted retries, throw the last error
            if (attempt > maxRetries) {
              next(lastError);
            }
          };
        };
        
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        
        module.exports = retryMiddleware;
      retry-middleware.py: |
        # Python retry middleware implementation
        import time
        import random
        from functools import wraps
        
        def retry_with_backoff(max_retries=3, base_delay=1, max_delay=30, multiplier=2, jitter=True):
            def decorator(func):
                @wraps(func)
                def wrapper(*args, **kwargs):
                    last_exception = None
                    
                    for attempt in range(max_retries + 1):
                        try:
                            return func(*args, **kwargs)
                        except Exception as e:
                            last_exception = e
                            
                            # Check if we should retry based on exception type
                            if not should_retry(e):
                                raise last_exception
                                
                            if attempt < max_retries:
                                # Calculate delay with exponential backoff
                                delay = min(base_delay * (multiplier ** attempt), max_delay)
                                
                                # Add jitter to prevent thundering herd
                                if jitter:
                                    delay *= (0.5 + random.random() * 0.5)
                                    
                                time.sleep(delay)
                    
                    raise last_exception
                return wrapper
            return decorator
        
        def should_retry(exception):
            # Define which exceptions should trigger a retry
            retryable_exceptions = (
                ConnectionError,
                TimeoutError,
                requests.exceptions.ConnectionError,
                requests.exceptions.Timeout,
                requests.exceptions.RequestException
            )
            return isinstance(exception, retryable_exceptions)
  retry-documentation.md: |
    # Retry Mechanisms with Exponential Backoff
    
    ## Overview
    This document describes the retry mechanisms with exponential backoff implemented in the Todo AI system to improve resilience and fault tolerance.
    
    ## Retry Strategies
    
    ### 1. Exponential Backoff
    - Initial delay: 1 second
    - Multiplier: 2
    - Maximum delay: 60 seconds
    - Formula: `delay = min(initial_delay * multiplier^attempt, max_delay)`
    
    ### 2. Jitter
    - Randomization added to prevent thundering herd
    - Prevents synchronized retries from overwhelming services
    
    ## Retry Configuration by Service
    
    ### External API Calls
    - Max retries: 5
    - Base delay: 1 second
    - Max delay: 60 seconds
    - Multiplier: 2
    - Retryable status codes: 500, 502, 503, 504, 408, 429
    
    ### Database Operations
    - Max retries: 3
    - Base delay: 0.5 seconds
    - Max delay: 10 seconds
    - Multiplier: 2
    - Retryable status codes: 409, 500, 503
    
    ### Message Queue Operations
    - Max retries: 10
    - Base delay: 1 second
    - Max delay: 60 seconds
    - Multiplier: 2
    - Retryable status codes: 500, 503
    
    ## Circuit Breaker Integration
    - Retry attempts contribute to circuit breaker failure counts
    - Circuit breaker opens after threshold failures
    - Prevents retry storms during outages
    
    ## Monitoring
    - Retry attempt counts
    - Retry success/failure rates
    - Average retry delays
    - End-to-end request times including retries
    
    ## Best Practices
    - Set appropriate retry limits to prevent indefinite retries
    - Use exponential backoff to prevent overwhelming failing services
    - Implement jitter to prevent synchronized retries
    - Monitor retry patterns for potential issues
    - Degrade gracefully when retries are exhausted
  retry-monitoring.yaml: |
    # Monitoring configuration for retry mechanisms
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: retry-monitoring-config
      namespace: monitoring
    data:
      prometheus-rules.yaml: |
        groups:
        - name: retry-monitoring
          rules:
          - alert: HighRetryRate
            expr: rate(retry_attempts_total[5m]) / rate(requests_total[5m]) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High retry rate detected"
              description: "Retry rate exceeded 10% of total requests for service {{ $labels.service }} in namespace {{ $labels.namespace }}"
          
          - alert: RetryExhausted
            expr: increase(retry_exhausted_total[5m]) > 10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Retry exhausted frequently"
              description: "Retry exhausted more than 10 times in 5 minutes for service {{ $labels.service }} in namespace {{ $labels.namespace }}"
          
          - alert: HighRetryLatency
            expr: histogram_quantile(0.95, rate(retry_duration_seconds_bucket[5m])) > 10
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High retry latency"
              description: "95th percentile retry duration exceeded 10 seconds for service {{ $labels.service }} in namespace {{ $labels.namespace }}"
