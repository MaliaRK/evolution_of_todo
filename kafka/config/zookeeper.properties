# Zookeeper configuration
# Basic settings
tickTime=2000
dataDir=/var/lib/zookeeper
clientPort=2181
initLimit=5
syncLimit=2

# Client connections
maxClientCnxns=60

# Server configuration for ensemble
# In a single-node setup (for local development):
server.1=zookeeper:2888:3888

# For multi-node setup (for production):
# server.1=zookeeper-1:2888:3888
# server.2=zookeeper-2:2888:3888
# server.3=zookeeper-3:2888:3888

# Leader election timeout
electionAlg=3

# Snap count
snapCount=10000

# Purge configuration
autopurge.snapRetainCount=3
autopurge.purgeInterval=1