# Kafka Consumer Group Management Configuration
# Settings for managing consumer groups in the Todo AI system

# Consumer group coordinator settings
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=1800000
group.initial.rebalance.delay.ms=3000

# Consumer group rebalancing
partition.assignment.strategy=org.apache.kafka.clients.consumer.RangeAssignor,org.apache.kafka.clients.consumer.RoundRobinAssignor,org.apache.kafka.clients.consumer.StickyAssignor

# Consumer settings for Todo AI system
consumer:
  # Session timeout for consumers
  session.timeout.ms: 10000
  
  # Heartbeat interval for consumers
  heartbeat.interval.ms: 3000
  
  # Maximum number of records to fetch in a single request
  max.poll.records: 1000
  
  # Maximum time to buffer records in the client
  max.poll.interval.ms: 300000  # 5 minutes
  
  # Fetch minimum bytes
  fetch.min.bytes: 1
  
  # Fetch maximum wait time
  fetch.max.wait.ms: 500
  
  # Maximum record size
  max.partition.fetch.bytes: 1048576  # 1MB

# Consumer group for task events
task-event-consumer:
  group.id: todo-task-consumer-group
  auto.offset.reset: earliest
  enable.auto.commit: false
  max.poll.records: 100
  max.in.flight.requests.per.connection: 1  # For exactly-once semantics

# Consumer group for activity events
activity-event-consumer:
  group.id: user-activity-consumer-group
  auto.offset.reset: latest
  enable.auto.commit: true
  auto.commit.interval.ms: 5000
  max.poll.records: 500

# Consumer group for metrics
metrics-consumer:
  group.id: system-metrics-consumer-group
  auto.offset.reset: latest
  enable.auto.commit: true
  max.poll.records: 1000

# Consumer group for error events (dead letter queue)
error-event-consumer:
  group.id: error-event-consumer-group
  auto.offset.reset: earliest
  enable.auto.commit: false
  max.poll.records: 10
  max.in.flight.requests.per.connection: 1

# Consumer retry and error handling configuration
retry:
  max.attempts: 3
  backoff.initial.delay.ms: 1000
  backoff.max.delay.ms: 10000
  backoff.multiplier: 2

# Dead letter queue configuration
dead.letter.queue:
  enabled: true
  topic.name: error-events
  max.retry.attempts: 3