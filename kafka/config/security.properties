# Kafka Security Configuration
# SSL/TLS and authentication settings for Kafka

# Enable SSL for inter-broker communication
ssl.inter.broker.protocol=SSL

# SSL keystore configuration
ssl.keystore.location=/var/private/ssl/kafka.server.keystore.jks
ssl.keystore.password={{SECRET:KEYSTORE_PASSWORD}}
ssl.key.password={{SECRET:KEY_PASSWORD}}

# SSL truststore configuration
ssl.truststore.location=/var/private/ssl/kafka.server.truststore.jks
ssl.truststore.password={{SECRET:TRUSTSTORE_PASSWORD}}

# SSL protocol and cipher suites
ssl.protocol=TLS
ssl.enabled.protocols=TLSv1.2,TLSv1.3
ssl.cipher.suites=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

# Authentication settings
sasl.mechanism=PLAIN
sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
security.inter.broker.protocol=SASL_SSL

# Authorization
authorizer.class.name=kafka.security.authorizer.AclAuthorizer
super.users=User:admin

# Listener security
listeners=PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093,SASL_PLAINTEXT://0.0.0.0:9094,SASL_SSL://0.0.0.0:9095
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL

# Production-specific security settings
# These would be enabled in production but disabled in local development
# ssl.client.auth=required
# authorizer.class.name=kafka.security.authorizer.AclAuthorizer