apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  # Kafka broker configuration
  - name: brokers
    value: "kafka:9092"
  - name: consumerGroup
    value: "todo-app"
  - name: clientID
    value: "todo-app"
  - name: authRequired
    value: "false"
  
  # Consumer configuration
  - name: consumerTimeout
    value: "1000"
  - name: consumeRetryInterval
    value: "200ms"
  - name: maxMessageBytes
    value: "1048576"
  - name: consumeTimeout
    value: "100"
  
  # Producer configuration
  - name: maxMessageBytes
    value: "1048576"
  - name: requiredAcks
    value: "-1"
  - name: partitioner
    value: "hash"
  - name: maxRetry
    value: "5"
  - name: retryBackoff
    value: "100ms"
  
  # TLS/SSL configuration (disabled by default)
  - name: disableTls
    value: "true"
  - name: saslUsername
    value: ""
  - name: saslPassword
    value: ""
  - name: saslMechanism
    value: "PLAIN"
  
  # Offset configuration
  - name: startOffset
    value: "0"
  
  # Topic configuration
  - name: publishTopicConfigs
    value: |
      {
        "retention.ms": "604800000",
        "segment.bytes": "1073741824",
        "cleanup.policy": "compact"
      }
  
  # Resiliency configuration
  - name: deliveryTimeout
    value: "30s"
  - name: readTimeout
    value: "30s"
  - name: writeTimeout
    value: "30s"