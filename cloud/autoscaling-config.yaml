apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-cloud-autoscaling-config
  namespace: todo-app
data:
  # Multi-cloud auto-scaling configuration
  multi-cloud-hpa-template.yaml: |
    # Template for multi-cloud HPA configuration
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: todo-app-multi-cloud-hpa
      namespace: todo-app
      annotations:
        # Cloud-specific annotations can be added as needed
        # azure: service.beta.azure.com/scale-type: "VirtualMachineScaleSets"
        # gcp: cloud.google.com/location-policy: "balanced"
        # oci: oci.oraclecloud.com/flex-pool: "true"
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: todo-app
      minReplicas: {{ .Values.autoscaling.minReplicas | default 2 }}
      maxReplicas: {{ .Values.autoscaling.maxReplicas | default 20 }}
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 70 }}
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDown.stabilizationWindowSeconds | default 300 }}
          policies:
          - type: Percent
            value: {{ .Values.autoscaling.scaleDown.percentPolicyValue | default 10 }}
            periodSeconds: {{ .Values.autoscaling.scaleDown.periodSeconds | default 60 }}
          - type: Pods
            value: {{ .Values.autoscaling.scaleDown.podsPolicyValue | default 2 }}
            periodSeconds: {{ .Values.autoscaling.scaleDown.periodSeconds | default 60 }}
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: {{ .Values.autoscaling.scaleUp.stabilizationWindowSeconds | default 60 }}
          policies:
          - type: Percent
            value: {{ .Values.autoscaling.scaleUp.percentPolicyValue | default 50 }}
            periodSeconds: {{ .Values.autoscaling.scaleUp.periodSeconds | default 60 }}
          - type: Pods
            value: {{ .Values.autoscaling.scaleUp.podsPolicyValue | default 5 }}
            periodSeconds: {{ .Values.autoscaling.scaleUp.periodSeconds | default 60 }}
          selectPolicy: Max
  multi-cloud-custom-metrics-config.yaml: |
    # Configuration for custom metrics across cloud providers
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: custom-metrics-config
      namespace: monitoring
    data:
      adapter-config.yaml: |
        # Configuration for custom metrics adapter
        rules:
        - seriesQuery: 'up{job="todo-app"}'
          resources:
            overrides:
              kubernetes_namespace: {resource: "namespace"}
              kubernetes_pod_name: {resource: "pod"}
          name:
            matches: "up"
            as: "todo_app_health"
          metricsQuery: 'avg_over_time(up{job="todo-app"}[5m])'
        - seriesQuery: 'http_requests_total{app="todo-app"}'
          resources:
            template: "namespace/{{.LabelMatchers.Get "__namespace__" }}"
          name:
            matches: "http_requests_total"
            as: "todo_app_requests_per_second"
          metricsQuery: 'round(avg(rate(http_requests_total{app="todo-app"}[2m])), 0.001)'
        - seriesQuery: 'cloud_provider_load_balancer_request_count{service="todo-app"}'
          resources:
            overrides:
              namespace: {resource: "namespace"}
              service: {resource: "service"}
              pod: {resource: "pod"}
          name:
            matches: "cloud_provider_load_balancer_request_count"
            as: "todo_app_lb_requests_per_second"
          metricsQuery: 'avg(rate(cloud_provider_load_balancer_request_count{service="todo-app"}[2m]))'
      azure-custom-metrics.yaml: |
        # Azure-specific custom metrics configuration
        apiVersion: custom.metrics.k8s.io/v1beta1
        kind: CustomMetric
        metadata:
          name: azure-load-balancer-requests-per-second
          namespace: todo-app
        spec:
          metricName: azure_load_balancer_requests_per_second
          selector:
            matchLabels:
              service: todo-app
          metricLabels:
            cloud_provider: azure
            resource_group: todo-app-rg
            cluster_name: todo-app-aks-cluster
      gcp-custom-metrics.yaml: |
        # GCP-specific custom metrics configuration
        apiVersion: custom.metrics.k8s.io/v1beta1
        kind: CustomMetric
        metadata:
          name: gcp-load-balancer-requests-per-second
          namespace: todo-app
        spec:
          metricName: gcp_load_balancer_requests_per_second
          selector:
            matchLabels:
              service: todo-app
          metricLabels:
            cloud_provider: gcp
            project_id: todo-app-project
            cluster_name: todo-app-gke-cluster
      oci-custom-metrics.yaml: |
        # OCI-specific custom metrics configuration
        apiVersion: custom.metrics.k8s.io/v1beta1
        kind: CustomMetric
        metadata:
          name: oci-load-balancer-requests-per-second
          namespace: todo-app
        spec:
          metricName: oci_load_balancer_requests_per_second
          selector:
            matchLabels:
              service: todo-app
          metricLabels:
            cloud_provider: oci
            compartment_id: ocid1.compartment.oc1..aaaaaaa...
            cluster_name: todo-app-oke-cluster
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscaling-best-practices
  namespace: todo-app
data:
  # Best practices for auto-scaling
  autoscaling-best-practices.md: |
    # Auto-Scaling Best Practices

    ## General Best Practices

    1. **Start Conservative**: Begin with conservative scaling thresholds and adjust based on observed usage patterns.

    2. **Monitor Scaling Events**: Track scaling events to understand if your application is scaling appropriately.

    3. **Consider Application Characteristics**: Stateless applications can scale more aggressively than stateful ones.

    4. **Avoid Overlapping Metrics**: Don't use multiple metrics that measure the same thing (e.g., CPU and memory utilization for the same resource constraint).

    5. **Set Appropriate Stabilization Windows**: Prevent thrashing by setting appropriate stabilization windows for scale-down operations.

    ## Cloud Provider Specific Best Practices

    ### Azure
    - Use Virtual Machine Scale Sets for optimal scaling performance
    - Consider Availability Zones for high availability
    - Use Azure Advisor for scaling recommendations
    - Monitor Azure-specific metrics like node pool capacity

    ### Google Cloud
    - Leverage preemptible instances for batch workloads
    - Use node auto-provisioning for dynamic node scaling
    - Monitor GKE-specific metrics like node pool utilization
    - Consider using regional clusters for high availability

    ### Oracle Cloud
    - Use flexible compute shapes for cost optimization
    - Monitor OKE-specific metrics like pod density
    - Consider using spot instances for non-critical workloads
    - Use OCI Metrics Explorer for scaling insights

    ## Resource Sizing Guidelines

    1. **CPU Requests**: Set CPU requests based on steady-state usage to ensure fair scheduling.

    2. **Memory Requests**: Set memory requests based on actual usage to prevent OOM kills.

    3. **CPU Limits**: Set CPU limits to prevent one pod from monopolizing CPU resources.

    4. **Memory Limits**: Set memory limits to prevent memory leaks from consuming all available memory.

    ## Scaling Triggers

    1. **Resource-Based Scaling**: Use CPU and memory utilization as primary scaling triggers.

    2. **Custom Metrics**: Use application-specific metrics like requests per second or queue depth.

    3. **Scheduled Scaling**: Use CronJobs for predictable load patterns.

    4. **External Metrics**: Use external metrics like load balancer request rates.

    ## Troubleshooting Common Issues

    1. **Scale-Up Delays**: Ensure sufficient quota and proper node pool configuration.

    2. **Scale-Down Thrashing**: Adjust stabilization windows and utilization thresholds.

    3. **Resource Starvation**: Monitor resource requests vs. actual usage.

    4. **Pod Disruption Budgets**: Set appropriate PDBs to prevent scaling from impacting availability.