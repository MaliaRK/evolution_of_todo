# Auto-Scaling Policies for Cloud Environments
# Configuration for auto-scaling specific to each cloud environment

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-autoscaling-config
  namespace: todo-app
data:
  # Azure auto-scaling configuration
  azure-hpa-config.yaml: |
    # Horizontal Pod Autoscaler for Azure
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: todo-app-azure-hpa
      namespace: todo-app
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: todo-app
      minReplicas: 2
      maxReplicas: 20
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 80
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 10
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 50
            periodSeconds: 60
          - type: Pods
            value: 5
            periodSeconds: 60
          selectPolicy: Max
  azure-vpa-config.yaml: |
    # Vertical Pod Autoscaler for Azure
    apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: todo-app-azure-vpa
      namespace: todo-app
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: todo-app
      updatePolicy:
        updateMode: "Auto"
      resourcePolicy:
        containerPolicies:
        - containerName: todo-app
          maxAllowed:
            cpu: 2000m
            memory: 4Gi
          minAllowed:
            cpu: 100m
            memory: 128Mi
  azure-cluster-autoscaler-config.yaml: |
    # Azure Cluster Autoscaler Configuration
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-autoscaler-azure-config
      namespace: kube-system
    data:
      # Configuration for Azure Cluster Autoscaler
      ClusterName: todo-app-aks-cluster
      NodeResourceGroup: MC_todo-app-rg_todo-app-aks-cluster_eastus
      ClientID: <azure-client-id>
      ClientSecret: <azure-client-secret>
      TenantID: <azure-tenant-id>
      SubscriptionID: <azure-subscription-id>
      VMType: "AKS"
      Location: "eastus"
      # Additional configuration options
      ScaleDownEnabled: "true"
      ScaleDownDelayAfterAdd: "10m"
      ScaleDownDelayAfterDelete: "10s"
      ScaleDownDelayAfterFailure: "3m"
      ScaleDownUnneededTime: "10m"
      ScaleDownUtilizationThreshold: "0.5"
      MaxEmptyBulkDelete: "10"
      MaxGracefulTerminationSec: "600"
      MaxNodeProvisionTime: "15m"
      MaxNodesTotal: "100"
      MaxPodGracePeriod: "600"
      NewPodScaleUpDelay: "0s"
      OkTotalUnreadyCount: "3"
      UnregisteredNodeRemovalTime: "10m"
      Verbosity: "3"
      WriteStatusConfigMap: "true"
      BalanceSimilarNodeGroups: "false"
      ExpendablePodsPriorityCutoff: "-10"
      IgnoreDaemonsetsUtilization: "false"
      IgnoreMirrorPods: "true"
      MaxTotalUnreadyPercentage: "45"
      MinRechargeDelay: "30s"
      NodeGroupAutoDiscovery: "auto"
      BalancingIgnoreLabel1: "some-label"
      BalancingIgnoreLabel2: "some-other-label"
      CloudProvider: "azure"
      AzureClusterName: "todo-app-aks-cluster"
      AzureResourceGroup: "todo-app-rg"
      AzureVMType: "AKS"
      AzureLocation: "eastus"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcp-autoscaling-config
  namespace: todo-app
data:
  # Google Cloud auto-scaling configuration
  gcp-hpa-config.yaml: |
    # Horizontal Pod Autoscaler for GCP
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: todo-app-gcp-hpa
      namespace: todo-app
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: todo-app
      minReplicas: 2
      maxReplicas: 30
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 65
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 75
      - type: Pods
        pods:
          metric:
            name: custom_metric_requests_per_second
          target:
            type: AverageValue
            averageValue: "100"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 10
            periodSeconds: 60
          - type: Pods
            value: 1
            periodSeconds: 60
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Percent
            value: 30
            periodSeconds: 60
          - type: Pods
            value: 3
            periodSeconds: 60
          selectPolicy: Max
  gcp-vpa-config.yaml: |
    # Vertical Pod Autoscaler for GCP
    apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: todo-app-gcp-vpa
      namespace: todo-app
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: todo-app
      updatePolicy:
        updateMode: "Auto"
      resourcePolicy:
        containerPolicies:
        - containerName: todo-app
          maxAllowed:
            cpu: 2500m
            memory: 5Gi
          minAllowed:
            cpu: 100m
            memory: 128Mi
  gcp-cluster-autoscaler-config.yaml: |
    # Google Cloud Cluster Autoscaler Configuration
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cluster-autoscaler-gcp-config
      namespace: kube-system
    data:
      # Configuration for GCP Cluster Autoscaler
      GKEClusterName: todo-app-gke-cluster
      GKEZone: us-central1-a
      GKEProject: todo-app-project
      # Additional configuration options
      ScaleDownEnabled: "true"
      ScaleDownDelayAfterAdd: "10m"
      ScaleDownDelayAfterDelete: "10s"
      ScaleDownDelayAfterFailure: "3m"
      ScaleDownUnneededTime: "10m"
      ScaleDownUtilizationThreshold: "0.5"
      MaxEmptyBulkDelete: "10"
      MaxGracefulTerminationSec: "600"
      MaxNodeProvisionTime: "15m"
      MaxNodesTotal: "100"
      MaxPodGracePeriod: "600"
      NewPodScaleUpDelay: "0s"
      OkTotalUnreadyCount: "3"
      UnregisteredNodeRemovalTime: "10m"
      Verbosity: "3"
      WriteStatusConfigMap: "true"
      BalanceSimilarNodeGroups: "false"
      ExpendablePodsPriorityCutoff: "-10"
      IgnoreDaemonsetsUtilization: "false"
      IgnoreMirrorPods: "true"
      MaxTotalUnreadyPercentage: "45"
      MinRechargeDelay: "30s"
      NodeGroupAutoDiscovery: "nodeGroupAutoDiscovery: daemonset"
      BalancingIgnoreLabel1: "some-label"
      BalancingIgnoreLabel2: "some-other-label"
      CloudProvider: "gce"
      GCEProject: "todo-app-project"
      GCERegion: "us-central1"
      GCEZone: "us-central1-a"
      NodeName: "gce:todo-app-gke-cluster"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-autoscaling-config
  namespace: todo-app
data:
  # Oracle Cloud auto-scaling configuration
  oci-hpa-config.yaml: |
    # Horizontal Pod Autoscaler for OCI
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: todo-app-oci-hpa
      namespace: todo-app
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: todo-app
      minReplicas: 2
      maxReplicas: 25
      metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 75
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 85
      - type: External
        external:
          metric:
            name: oci_load_balancer_request_rate
            selector:
              matchLabels:
                service: todo-app
          target:
            type: AverageValue
            averageValue: "50"
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 15
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: 90
          policies:
          - type: Percent
            value: 40
            periodSeconds: 60
          - type: Pods
            value: 4
            periodSeconds: 60
          selectPolicy: Max
  oci-vpa-config.yaml: |
    # Vertical Pod Autoscaler for OCI
