apiVersion: v2
name: todo-app
description: A Helm chart for the Todo AI System with Kafka and Dapr integration
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kafka
    version: "27.1.2"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: dapr
    version: "1.9.3"
    repository: https://dapr.github.io/helm-charts/
    condition: dapr.enabled