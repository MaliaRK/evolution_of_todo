# Default values for todo-app
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: todo-app/backend
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Custom metrics for event processing
  customMetrics:
    - type: Pods
      pods:
        metric:
          name: event_processing_rate
        target:
          type: AverageValue
          averageValue: "100"
    - type: Pods
      pods:
        metric:
          name: queue_length
        target:
          type: AverageValue
          averageValue: "50"

nodeSelector: {}

tolerations: []

affinity: {}

# Kafka configuration
kafka:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: false
  zookeeper:
    enabled: true
    persistence:
      enabled: false

# Dapr configuration
dapr:
  enabled: true
  globalConfig:
    tracing:
      samplingRate: "1"
      zipkin:
        endpointAddress: "http://zipkin.default.svc.cluster.local:9411/api/v2/spans"
  components:
    - name: kafka-pubsub
      type: pubsub.kafka
      version: v1
      metadata:
        - name: brokers
          value: "kafka:9092"
        - name: consumerGroup
          value: "todo-app"
        - name: clientID
          value: "todo-app"
        - name: authRequired
          value: "false"