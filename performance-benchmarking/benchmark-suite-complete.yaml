        ---
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: weekly-performance-benchmarks
          namespace: performance
        spec:
          schedule: "0 2 * * 0"  # Every Sunday at 2 AM
          jobTemplate:
            spec:
              template:
                spec:
                  serviceAccountName: benchmark-executor-sa
                  containers:
                  - name: benchmark-runner
                    image: busybox:latest
                    command:
                    - /bin/sh
                    - -c
                    - |
                      # Install required tools
                      wget -qO- https://github.com/rakyll/hey/releases/download/v0.1.4/hey_linux_amd64.tar.gz | tar xz
                      mv hey /usr/local/bin/
                      
                      # Run weekly benchmarks
                      BENCHMARK_CATEGORY="response-time" /benchmark-runner.sh
                      BENCHMARK_CATEGORY="throughput" /benchmark-runner.sh
                      BENCHMARK_CATEGORY="reliability" /benchmark-runner.sh
                    volumeMounts:
                    - name: benchmarks
                      mountPath: /etc/benchmarks
                    - name: results
                      mountPath: /results
                    env:
                    - name: BENCHMARK_SUITE
                      value: "/etc/benchmarks/benchmark-suite.yaml"
                    - name: RESULTS_DIR
                      value: "/results"
                    - name: PERFORMANCE_TEST_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: performance-test-secrets
                          key: token
                  volumes:
                  - name: benchmarks
                    configMap:
                      name: benchmark-suite-config
                  - name: results
                    persistentVolumeClaim:
                      claimName: benchmark-results-pvc
                  restartPolicy: Never
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 1