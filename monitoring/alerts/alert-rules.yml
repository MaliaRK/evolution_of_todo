# Alerting Rules Configuration
# Configuration for alerting rules in the Todo AI system monitoring

# Prometheus Alerting Rules
groups:
  - name: todo-app.rules
    rules:
      # Health and availability alerts
      - alert: TodoAppDown
        expr: up{job="todo-app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Todo App instance is down"
          description: "Todo App instance {{ $labels.instance }} has been down for more than 2 minutes."
      
      - alert: TodoAppHighErrorRate
        expr: (rate(todo_app_http_requests_total{status=~"5.."}[5m]) / rate(todo_app_http_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on Todo App"
          description: "Todo App {{ $labels.instance }} has a high error rate (>5%) over the last 5 minutes."
      
      - alert: TodoAppResponseTimeHigh
        expr: histogram_quantile(0.95, rate(todo_app_http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Todo App response time is high"
          description: "Todo App {{ $labels.instance }} 95th percentile response time is above 1 second."
      
      # Resource utilization alerts
      - alert: TodoAppHighCPUUsage
        expr: 100 - (avg by(instance) (irate(process_cpu_seconds_total{job="todo-app"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Todo App high CPU usage"
          description: "Todo App {{ $labels.instance }} CPU usage is above 80% for more than 5 minutes."
      
      - alert: TodoAppHighMemoryUsage
        expr: (process_resident_memory_bytes{job="todo-app"} / process_virtual_memory_max_bytes{job="todo-app"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Todo App high memory usage"
          description: "Todo App {{ $labels.instance }} memory usage is above 85% for more than 5 minutes."

  - name: dapr.rules
    rules:
      # Dapr-specific alerts
      - alert: DaprSidecarDown
        expr: up{job="dapr"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Dapr sidecar is down"
          description: "Dapr sidecar {{ $labels.instance }} has been down for more than 2 minutes."
      
      - alert: DaprHighGRPCErrorRate
        expr: (rate(dapr_grpc_completed_calls{status!~"OK|CANCELLED"}[5m]) / rate(dapr_grpc_completed_calls[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High gRPC error rate in Dapr"
          description: "Dapr {{ $labels.instance }} has a high gRPC error rate (>5%) over the last 5 minutes."
      
      - alert: DaprStateOperationLatencyHigh
        expr: histogram_quantile(0.95, rate(dapr_state_get_duration_seconds_bucket[5m])) > 0.5 or histogram_quantile(0.95, rate(dapr_state_set_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dapr state operation latency is high"
          description: "Dapr {{ $labels.instance }} 95th percentile state operation latency is above 0.5 seconds."

  - name: kafka.rules
    rules:
      # Kafka-specific alerts
      - alert: KafkaDown
        expr: up{job="kafka"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "Kafka broker {{ $labels.instance }} has been down for more than 2 minutes."
      
      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_server_replicamanager_underreplicatedpartitions > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kafka has under-replicated partitions"
          description: "Kafka cluster has {{ $value }} under-replicated partitions for more than 5 minutes."
      
      - alert: KafkaOfflinePartitions
        expr: kafka_controller_kafkacontroller_offlinepartitionscount > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka has offline partitions"
          description: "Kafka cluster has {{ $value }} offline partitions."
      
      - alert: KafkaTooManyActiveControllers
        expr: count(kafka_controller_kafkacontroller_activecontrollercount == 1) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka has more than one active controller"
          description: "Kafka cluster has {{ $value }} active controllers, expected 1."

  - name: kubernetes.rules
    rules:
      # Kubernetes cluster alerts
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes node is not ready"
          description: "Node {{ $labels.node }} has been unready for more than 15 minutes."
      
      - alert: KubePodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod is crash looping"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping."
      
      - alert: KubeCPUOvercommit
        expr: (sum(namespace_cpu:kube_pod_container_resource_requests:sum{}) / sum(kube_node_status_allocatable{resource="cpu"})) * 100 > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cluster has CPU overcommit"
          description: "Cluster has over 80% CPU overcommit for more than 15 minutes."

  - name: business.rules
    rules:
      # Business-specific alerts
      - alert: HighTaskCreationFailureRate
        expr: (rate(todo_app_business_events_total{event_type="task_creation_failed"}[5m]) / rate(todo_app_business_events_total{event_type=~"task_creation_requested|task_creation_failed"}[5m])) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High task creation failure rate"
          description: "Task creation failure rate is above 10% for more than 5 minutes."
      
      - alert: LowTaskCompletionRate
        expr: (rate(todo_app_business_events_total{event_type="task_completed"}[15m]) / rate(todo_app_business_events_total{event_type="task_created"}[15m])) * 100 < 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Low task completion rate"
          description: "Task completion rate is below 50% for more than 30 minutes."

# Alertmanager Configuration
ALERTMANAGER_CONFIG:
  global:
    # The smarthost and SMTP sender used for mail notifications
    smtp_smarthost: 'localhost:587'
    smtp_from: 'alertmanager@example.org'
    smtp_auth_username: 'alertmanager'
    smtp_auth_password: 'password'
  
  # The root route on which each incoming alert enters
  route:
    # The root route must not have any matchers as it is the entry point for all alerts
    group_by: ['alertname', 'cluster', 'service']
    
    # When a new group of alerts is created by an incoming alert, wait at least 'group_wait' to send the initial notification
    group_wait: 30s
    
    # When the first notification was sent, wait 'group_interval' to send a batch of new alerts that arrived since the first alert
    group_interval: 5m
    
    # If an alert has successfully been sent, wait 'repeat_interval' to resend them
    repeat_interval: 3h
    
    # A default receiver
    receiver: default
    
    # All the above attributes are inherited by all child routes and can overwritten on each
    routes:
      # Send severity=critical alerts to critical slack channel
      - matchers:
          - severity="critical"
        receiver: critical-slack
        repeat_interval: 30m
      
      # Send alerts with a broadcast=1 label to the 'broadcast' receiver
      - matchers:
          - broadcast="1"
        receiver: broadcast
  
  receivers:
    - name: 'default'
      email_configs:
        - to: 'dev-team@example.com'
          send_resolved: true
    
    - name: 'critical-slack'
      slack_configs:
        - send_resolved: true
          text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
          channel: '#critical-alerts'
          api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    
    - name: 'broadcast'
      webhook_configs:
        - url: 'http://broadcast-webhook:8080/'
          send_resolved: true

  # Inhibition rules allow to mute a set of alerts given that another alert is firing
  inhibit_rules:
    - source_matchers:
        - severity="critical"
      target_matchers:
        - severity="warning"
      equal: ['alertname', 'cluster', 'service']

# Alert Routing Configuration
ALERT_ROUTING:
  # Route alerts to appropriate teams
  routing_rules:
    development_team:
      matchers:
        - service=~"todo-app|frontend|backend"
        - environment=~"dev|development"
      receivers: [dev-team-email]
    
    operations_team:
      matchers:
        - alertname=~"Kube.*|Node.*|Pod.*"
      receivers: [ops-team-pagerduty]
    
    platform_team:
      matchers:
        - service=~"dapr|kafka|kubernetes"
      receivers: [platform-team-slack]
    
    security_team:
      matchers:
        - severity="critical"
        - category="security"
      receivers: [security-team-pagerduty]

# Alert Suppression Rules
ALERT_SUPPRESSION:
  # Rules to suppress certain alerts
  suppression_rules:
    maintenance_window_suppression:
      enabled: true
      schedule: "02:00-04:00 UTC daily"
      suppressed_alerts: ["TodoAppDown", "KubeNodeNotReady"]
    
    known_issues_suppression:
      enabled: true
      issue_tracker_integration: true
      auto_suppress_duration: 24h  # Suppress for 24 hours when issue is open
    
    cascading_failure_suppression:
      enabled: true
      rules:
        - if: "KubeNodeNotReady"
          suppress: ["KubePodCrashLooping", "TodoAppDown"]
          duration: 10m

# Alert Enrichment
ALERT_ENRICHMENT:
  # Additional information to add to alerts
  enrichment_data:
    service_owner: "dev-team@example.com"
    escalation_path: "https://wiki.todo-app.com/escalation"
    runbook_link: "https://wiki.todo-app.com/runbooks/{{ .Alerts.Labels.alertname }}"
    dashboard_link: "http://grafana.todo-app.com/dashboard/db/{{ .Alerts.Labels.service }}?from=now-1h&to=now"
  
  # Contextual information
  contextual_info:
    environment: "${ENVIRONMENT}"
    cluster: "${CLUSTER_NAME}"
    region: "${REGION}"
    deployment_time: "${DEPLOYMENT_TIMESTAMP}"
    git_commit: "${GIT_COMMIT_SHA}"