# Grafana Configuration
# Configuration for Grafana dashboards and data sources

apiVersion: 1

# Data sources configuration
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: 'loki'
        tags: ['cluster', 'hostname', 'level']
        mappedTags: [{ key: 'service.name', value: 'service' }]
        mapTagNamesEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: 'prometheus'
      search:
        hide: false
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "\\[.+\\]\\s\\[.+\\]\\s(?P<traceId>[a-zA-Z0-9]+)"
          name: traceId
          url: '$${__value.raw}'

# Dashboard configuration
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

# Dashboards to provision
dashboards:
  # Kubernetes cluster monitoring
  - name: 'k8s-cluster-monitoring'
    uid: 'k8s-cluster'
    url: 'https://grafana.com/api/dashboards/13776/revisions/1/download'
    datasource: 'Prometheus'

  # Kubernetes apps monitoring
  - name: 'k8s-apps-monitoring'
    uid: 'k8s-apps'
    url: 'https://grafana.com/api/dashboards/13767/revisions/1/download'
    datasource: 'Prometheus'

  # Kafka monitoring
  - name: 'kafka-monitoring'
    uid: 'kafka-overview'
    url: 'https://grafana.com/api/dashboards/7586/revisions/1/download'
    datasource: 'Prometheus'

  # Dapr monitoring
  - name: 'dapr-monitoring'
    uid: 'dapr-overview'
    url: 'https://grafana.com/api/dashboards/14051/revisions/1/download'
    datasource: 'Prometheus'

  # Custom Todo App dashboard
  - name: 'todo-app-dashboard'
    uid: 'todo-app'
    file: './dashboards/todo-app.json'

# Grafana server configuration
server:
  http_addr: 0.0.0.0
  http_port: 3000
  protocol: http
  root_url: http://localhost:3000
  serve_from_sub_path: false
  static_root_path: public
  enable_gzip: true
  cert_file: ""
  cert_key: ""

# Security configuration
security:
  admin_user: admin
  admin_password: ${GRAFANA_ADMIN_PASSWORD}
  allow_embedding: false
  cookie_secure: false
  cookie_samesite: disabled
  disable_gravatar: false
  data_source_proxy_whitelist: ""
  disable_brute_force_lockout: false
  middlewares_to_ignore: ""
  secret_key: ${GRAFANA_SECRET_KEY}

# Auth configuration
auth:
  disable_login_form: false
  oauth_auto_login: false
  sigv4_auth_enabled: false
  signing_key: ""
  ldap:
    enabled: false
    allow_sign_up: true
    config_file: /etc/grafana/ldap.toml

# Anonymous access (disable in production)
auth.anonymous:
  enabled: false
  org_name: 'Main Org.'
  org_role: Viewer
  hide_version: false

# User registration
users:
  allow_sign_up: false
  allow_org_create: false
  auto_assign_org: true
  auto_assign_org_id: 1
  auto_assign_org_role: Viewer
  verify_email_enabled: false
  login_hint: 'email or username'
  password_hint: 'minimum 4 characters'
  default_theme: 'dark'
  home_page: ''

# Alerting configuration
alerting:
  enabled: true
  execute_alerts: true
  error_or_timeout: 'alerting'
  nodata_or_nullvalues: 'no_data'
  concurrent_render_limit: 5
  rendering_queue_worker_count: 50
  max_attempts: 3
  evaluation_timeout_seconds: 30
  notification_timeout_seconds: 30
  max_annotation_age: ""
  max_annotations_to_keep: 0

# Unified alerting configuration
unified_alerting:
  enabled: true
  evaluation_timeout: 30s
  execution_max_concurrency: 2
  min_interval: 10s
  max_attempts: 3
  min_execution_interval: 1s

# Feature toggles
feature_toggles:
  enable: unified-alerting,accesscontrol,tempo-search,tempoApi,traceql,spanmetrics