apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-network-policy
  namespace: todo-app
spec:
  podSelector:
    matchLabels:
      app: todo-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: dapr-system
    - podSelector:
        matchLabels:
          app: todo-app
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: dapr-system
    - namespaceSelector:
        matchLabels:
          name: kafka