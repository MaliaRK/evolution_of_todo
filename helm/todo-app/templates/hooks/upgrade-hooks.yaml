apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include \"todo-app.fullname\" . }}-pre-upgrade-hook"
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
  labels:
    app.kubernetes.io/name: {{ include \"todo-app.name\" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pre-upgrade-check
        image: busybox
        command: ['sh', '-c', 'echo Running pre-upgrade checks... && sleep 10']
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include \"todo-app.fullname\" . }}-post-upgrade-hook"
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
  labels:
    app.kubernetes.io/name: {{ include \"todo-app.name\" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: post-upgrade-validation
        image: busybox
        command: ['sh', '-c', 'echo Running post-upgrade validation... && sleep 10']