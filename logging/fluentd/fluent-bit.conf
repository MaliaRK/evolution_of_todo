# Fluent Bit Configuration
# Configuration for Fluent Bit logging agents in the Todo AI system

[SERVICE]
    # Flush every 5 seconds
    Flush         5
    # Use UTC timezone
    Timezone      utc
    # Daemon mode (background)
    Daemon        off
    # Log Level
    Log_Level     info
    # Parsers configuration
    Parsers_File  parsers.conf
    # Plugins configuration
    Plugins_File  plugins.conf
    # HTTP Server
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Skip_Long_Lines   On
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit     50MB
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   5M

[INPUT]
    Name              systemd
    Tag               systemd.*
    Systemd_Filter    _SYSTEMD_UNIT=todo-app.service
    Read_From_Tail    On

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off

[FILTER]
    Name                nest
    Match               kube.*
    Operation           lift
    Nested_Under        kubernetes
    Add_Prefix          k8s_

[FILTER]
    Name                modify
    Match               *
    Copy                k8s_container_name container_name
    Copy                k8s_namespace_name namespace
    Copy                k8s_pod_name       pod_name
    Remove_regex        ^k8s_.*

[OUTPUT]
    Name            es
    Match           *
    Host            elasticsearch
    Port            9200
    Index           logs-${ENVIRONMENT}-${DATE:-%Y.%m.%d}
    Logstash_Format On
    Logstash_Prefix logs-${ENVIRONMENT}
    Replace_Dots    On
    Retry_Limit     False

[OUTPUT]
    Name            forward
    Match           *
    Host            loki
    Port            24224
    Retry_Limit     False
    # Loki requires specific labels to be sent as tags
    Labels          cluster=todo-app,environment=${ENVIRONMENT}