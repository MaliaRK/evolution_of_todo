# Centralized Log Aggregation System Configuration
# Configuration for the centralized logging system in the Todo AI system

# Elasticsearch Configuration
ELASTICSEARCH:
  CLUSTER_SETTINGS:
    cluster_name: "todo-app-logging"
    node_name: "${HOSTNAME}"
    network_host: "0.0.0.0"
    http_port: 9200
    transport_port: 9300
    
    # Memory settings
    heap_size: "2g"
    heap_newgen_size: "1g"
    
    # Discovery settings
    discovery_type: "single-node"  # Use "multi-node" in production
    initial_master_nodes: ["es-node-1", "es-node-2", "es-node-3"]
    
    # Index settings
    index_settings:
      number_of_shards: 1
      number_of_replicas: 1  # Increase to 2+ in production
      refresh_interval: "30s"
      translog_durability: "request"
  
  INDEX_TEMPLATES:
    log_index_template:
      index_patterns: ["logs-*"]
      template:
        settings:
          number_of_shards: 1
          number_of_replicas: 1
          refresh_interval: "30s"
          number_of_routing_shards: 30
          codec: "best_compression"
          mappings:
            dynamic: true
            properties:
              "@timestamp":
                type: "date"
              "timestamp":
                type: "date"
              "level":
                type: "keyword"
              "logger":
                type: "keyword"
              "message":
                type: "text"
                analyzer: "standard"
              "service":
                type: "keyword"
              "environment":
                type: "keyword"
              "host":
                type: "keyword"
              "pod":
                type: "keyword"
              "correlation_id":
                type: "keyword"
              "user_id":
                type: "keyword"
              "trace_id":
                type: "keyword"
              "span_id":
                type: "keyword"
  
  ILM_POLICY:
    log_retention_policy:
      policy_id: "log-retention-policy"
      description: "ILM policy for log retention"
      hot:
        actions:
          rollover:
            max_age: "1d"
            max_size: "1GB"
          set_priority:
            priority: 100
      warm:
        min_age: "1d"
        actions:
          allocate:
            number_of_replicas: 1
            include: {}
            exclude: {}
      cold:
        min_age: "7d"
        actions:
          allocate:
            number_of_replicas: 0
            include: {}
            exclude: {}
      delete:
        min_age: "30d"
        actions:
          delete: {}

# Loki Configuration
LOKI:
  server:
    http_listen_port: 3100
    grpc_listen_port: 9096
  
  ingester:
    lifecycler:
      address: 0.0.0.0
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1  # Increase to 3 in production
      final_sleep: 0s
    chunk_idle_period: 1h       # Time after which a chunk is flushed if idle
    chunk_block_size: 262144   # Size of each block in the chunk (256KB)
    chunk_encoding: snappy     # Encoding to use for chunks
    chunk_retain_period: 30s   # Period to retain chunks in memory after flushing
    max_transfer_retries: 0    # Number of times to retry transferring chunks when shutting down
  
  schema_config:
    configs:
      - from: 2023-01-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
  
  storage_config:
    boltdb_shipper:
      active_index_directory: /tmp/loki/boltdb-shipper-active
      cache_location: /tmp/loki/boltdb-shipper-cache
      cache_ttl: 24h         # Can be increased for faster queries
      shared_store: filesystem
    
    filesystem:
      directory: /tmp/loki/chunks
  
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h   # 7 days
    ingestion_rate_mb: 8               # MB/second per tenant
    ingestion_burst_size_mb: 16        # Max burst size
    retention_period: 168h             # 7 days retention
    max_query_lookback: 336h           # 14 days maximum query lookback

# Log Processing Pipeline
LOG_PROCESSING_PIPELINE:
  INPUTS:
    fluent_bit_forward:
      type: "forward"
      port: 24224
      bind: "0.0.0.0"
    
    file_input:
      type: "file"
      path: "/var/log/containers/*.log"
      start_position: "beginning"
      refresh_interval: 5
    
    http_input:
      type: "http"
      port: 8080
      bind: "0.0.0.0"
  
  FILTERS:
    parser_filter:
      type: "grok"
      match: ["message", "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}"]
    
    geoip_filter:
      type: "geoip"
      source: "client_ip"
      target: "geo_coordinates"
    
    mutate_filter:
      type: "mutate"
      convert:
        "response_time": "float"
        "bytes_sent": "integer"
      add_field:
        "environment": "${ENVIRONMENT}"
        "service": "${SERVICE_NAME}"
  
  OUTPUTS:
    elasticsearch_output:
      type: "elasticsearch"
      hosts: ["elasticsearch:9200"]
      index: "logs-%{+YYYY.MM.dd}"
      template_name: "log-template"
      template_overwrite: true
      flush_size: 1000
      idle_flush_time: 10
    
    loki_output:
      type: "loki"
      url: "http://loki:3100/loki/api/v1/push"
      batch_size: 1024000
      template: '{"stream": "service={{.Labels.service}},env={{.Labels.environment}}", "values": [[ "{{.Timestamp}}", "{{.Entry}}" ]]}'

# Log Retention and Archival
LOG_RETENTION:
  retention_policies:
    application_logs:
      retention_period: 30  # days
      archival_strategy: "move_to_cold_storage"
      compression: "gzip"
    
    audit_logs:
      retention_period: 365  # days (compliance requirement)
      archival_strategy: "permanent_storage"
      encryption: true
    
    security_logs:
      retention_period: 90  # days
      archival_strategy: "compliance_storage"
      encryption: true
  
  archival_process:
    schedule: "daily_at_midnight"
    destination: "s3://todo-app-logs-archive/${ENVIRONMENT}/"
    format: "parquet"
    compression: "snappy"

# Log Search and Analysis
LOG_SEARCH:
  search_capabilities:
    full_text_search: true
    structured_search: true
    aggregations: true
    correlations: true
  
  search_performance:
    indexing_speed: "real_time"
    query_response_time: "< 500ms"
    result_accuracy: "> 95%"
  
  visualization:
    dashboard_templates:
      - application_performance
      - error_trends
      - user_activity
      - security_events
      - infrastructure_health

# Log Security and Compliance
LOG_SECURITY:
  access_control:
    authentication: "required"
    authorization: "rbac_based"
    audit_logging: "enabled"
  
  data_protection:
    encryption_at_rest: true
    encryption_in_transit: true
    data_masking: true
    pii_detection: true
  
  compliance:
    gdpr_compliant: true
    hipaa_compliant: false  # Set to true if handling healthcare data
    pci_dss_compliant: false  # Set to true if handling payment data
    log_retention_compliance: true

# Monitoring and Alerting
LOG_MONITORING:
  health_metrics:
    - log_ingestion_rate
    - log_processing_latency
    - storage_utilization
    - query_performance
  
  alerting_rules:
    high_error_rate:
      condition: "error_logs_per_minute > 100"
      severity: "critical"
      notification: "immediate"
    
    log_storage_full:
      condition: "storage_utilization > 90%"
      severity: "critical"
      notification: "immediate"
    
    log_pipeline_down:
      condition: "log_ingestion_rate == 0"
      severity: "critical"
      notification: "immediate"