# Structured Logging Format Configuration
# Configuration for structured logging across all components of the Todo AI system

# Log Format Specifications
LOG_FORMAT_SPECIFICATIONS:
  APPLICATION_LOGS:
    format: json
    timestamp_format: ISO8601
    required_fields:
      - timestamp
      - level
      - logger
      - message
      - service
      - environment
      - trace_id
      - span_id
      - correlation_id
    
    optional_fields:
      - user_id
      - session_id
      - request_id
      - component
      - operation
      - duration_ms
      - status_code
      - error_code
      - error_message
      - source_ip
      - user_agent
      - resource_id
      - resource_type
      - action
    
    field_constraints:
      timestamp:
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
        required: true
        indexed: true
      
      level:
        values: ["DEBUG", "INFO", "WARN", "ERROR", "FATAL"]
        required: true
        indexed: true
      
      logger:
        format: "dotted.string.notation"
        required: true
        indexed: true
      
      message:
        max_length: 10000
        required: true
        searchable: true
      
      service:
        format: "lowercase-with-dashes"
        required: true
        indexed: true
      
      environment:
        values: ["development", "staging", "production"]
        required: true
        indexed: true

  ACCESS_LOGS:
    format: json
    timestamp_format: ISO8601
    required_fields:
      - timestamp
      - level
      - type: "access"
      - remote_addr
      - method
      - uri
      - protocol
      - status_code
      - response_size
      - duration_ms
      - user_agent
      - referer
      - correlation_id
      - trace_id
    
    field_constraints:
      remote_addr:
        format: "ipv4-or-ipv6"
        required: true
        indexed: true
      
      method:
        values: ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD", "OPTIONS"]
        required: true
        indexed: true
      
      status_code:
        format: "numeric"
        required: true
        indexed: true
      
      duration_ms:
        format: "integer"
        required: true
        indexed: true

  BUSINESS_EVENT_LOGS:
    format: json
    timestamp_format: ISO8601
    required_fields:
      - timestamp
      - level
      - type: "business_event"
      - event_name
      - event_type
      - user_id
      - session_id
      - correlation_id
      - trace_id
      - payload
    
    field_constraints:
      event_name:
        format: "snake_case"
        required: true
        indexed: true
      
      event_type:
        values: ["user_action", "system_event", "business_transaction"]
        required: true
        indexed: true
      
      payload:
        format: "json_object"
        max_size: 10000
        searchable: true

# Log Enrichment Configuration
LOG_ENRICHMENT:
  # Automatic enrichment of log entries
  enrichment_fields:
    static_fields:
      deployment_id: "${DEPLOYMENT_ID}"
      region: "${REGION}"
      availability_zone: "${AVAILABILITY_ZONE}"
      instance_id: "${INSTANCE_ID}"
      pod_name: "${K8S_POD_NAME}"
      namespace: "${K8S_NAMESPACE}"
      node_name: "${K8S_NODE_NAME}"
    
    dynamic_fields:
      cpu_usage: "runtime.metric.cpu.utilization"
      memory_usage: "runtime.metric.memory.utilization"
      disk_usage: "runtime.metric.disk.utilization"
      network_io: "runtime.metric.network.io"
    
    contextual_fields:
      request_headers: ["x-forwarded-for", "x-real-ip", "x-request-id"]
      session_context: ["user_id", "tenant_id", "role"]
      business_context: ["order_id", "customer_id", "campaign_id"]

  # Field sanitization
  sanitization_rules:
    remove_fields:
      - "auth_token"
      - "password"
      - "credit_card"
      - "ssn"
      - "api_key"
    
    mask_fields:
      - field: "email"
        pattern: "^(.)(.*)(.@.*)$"
        replacement: "$1***$3"
      
      - field: "phone"
        pattern: "^(\d{3})(\d{3})(\d{4})$"
        replacement: "$1-***-$3"
      
      - field: "ip_address"
        pattern: "^(\d+\.\d+\.)\d+\.(\d+)$"
        replacement: "$1*.${2}"

# Log Sampling Configuration
LOG_SAMPLING:
  # Configuration for log sampling to reduce volume
  sampling_strategies:
    probabilistic_sampling:
      default_rate: 1.0  # 100% for development, reduce for production
      service_overrides:
        "todo-app": 0.1  # 10% sampling for todo-app in production
        "dapr-sidecar": 0.05  # 5% sampling for dapr in production
    
    adaptive_sampling:
      enabled: true
      based_on:
        - log_level: ["ERROR", "FATAL"]
          sample_rate: 1.0  # Always log errors
        - log_volume: "> 1000 logs/sec"
          sample_rate: 0.5  # Reduce to 50% if volume is high
        - error_rate: "> 5%"
          sample_rate: 1.0  # Increase to 100% if error rate is high
    
    deterministic_sampling:
      enabled: true
      based_on:
        - correlation_id: "sample_every_100th"
        - user_id: "sample_premium_users_100_percent"

# Log Routing Configuration
LOG_ROUTING:
  # Configuration for routing logs to different destinations
  routing_rules:
    by_log_level:
      DEBUG:
        destinations: ["local_disk", "central_logging"]
        retention: "24h"
      INFO:
        destinations: ["central_logging"]
        retention: "7d"
      WARN:
        destinations: ["central_logging", "alerting_system"]
        retention: "30d"
      ERROR:
        destinations: ["central_logging", "alerting_system", "long_term_storage"]
        retention: "90d"
      FATAL:
        destinations: ["central_logging", "alerting_system", "long_term_storage", "security_team"]
        retention: "1y"
    
    by_log_type:
      access_logs:
        destinations: ["central_logging", "analytics_platform"]
        retention: "30d"
      business_events:
        destinations: ["central_logging", "analytics_platform", "compliance_storage"]
        retention: "7y"
      security_events:
        destinations: ["central_logging", "security_platform", "compliance_storage"]
        retention: "7y"
    
    by_content:
      error_patterns:
        pattern: ".*exception|.*error|.*failure.*"
        destinations: ["alerting_system", "error_tracking"]
        priority: high
      security_patterns:
        pattern: ".*authentication|.*authorization|.*access_denied.*"
        destinations: ["security_team", "siem"]
        priority: critical

# Log Serialization Configuration
LOG_SERIALIZATION:
  # Configuration for how logs are serialized and transmitted
  serialization_format:
    json:
      pretty_print: false
      field_order: ["timestamp", "level", "logger", "message"]
      null_handling: "omit_field"
      unicode_escaping: false
    
    compression:
      algorithm: gzip
      min_size: 1024  # Only compress if log is larger than 1KB
      compression_level: 6  # Balanced compression

  # Transmission configuration
  transmission:
    batch_size: 100
    batch_timeout: 5s
    max_retries: 3
    retry_backoff: 1s
    retry_jitter: true
    connection_pool_size: 10
    connection_timeout: 10s
    read_timeout: 30s

# Log Validation Configuration
LOG_VALIDATION:
  # Configuration for validating log entries
  validation_rules:
    required_fields_present: true
    field_format_validation: true
    field_value_constraints: true
    json_schema_validation: true
    size_limits: true
  
  validation_schemas:
    application_log_schema:
      type: object
      required: ["timestamp", "level", "logger", "message", "service", "environment"]
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: ["DEBUG", "INFO", "WARN", "ERROR", "FATAL"]
        logger:
          type: string
          pattern: "^[a-z][a-z0-9_.]*[a-z0-9]$"
        message:
          type: string
          maxLength: 10000
        service:
          type: string
          pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
        environment:
          type: string
          enum: ["development", "staging", "production"]
  
  invalid_log_handling:
    action: "send_to_dead_letter_queue"
    dead_letter_queue: "invalid-logs"
    notification: "log_validation_team"

# Component-Specific Logging Configuration
COMPONENT_LOGGING:
  todo_app_logging:
    loggers:
      com.todoapp.api:
        level: INFO
        additivity: false
        appenders: ["console", "file", "central"]
      
      com.todoapp.service:
        level: INFO
        additivity: false
        appenders: ["console", "file", "central"]
      
      com.todoapp.repository:
        level: DEBUG
        additivity: false
        appenders: ["file", "central"]
    
    custom_fields:
      user_id: "MDC.user_id"
      correlation_id: "MDC.correlation_id"
      trace_id: "MDC.trace_id"
  
  dapr_logging:
    loggers:
      dapr.runtime:
        level: INFO
        appenders: ["dapr-stdout"]
      
      dapr.components:
        level: INFO
        appenders: ["dapr-stdout"]
    
    custom_fields:
      app_id: "dapr.app_id"
      component: "dapr.component"
  
  kafka_logging:
    loggers:
      kafka.server:
        level: INFO
        appenders: ["kafka-logs"]
      
      kafka.cluster:
        level: INFO
        appenders: ["kafka-logs"]
    
    custom_fields:
      broker_id: "kafka.broker_id"
      topic: "kafka.topic"

# Compliance and Audit Configuration
COMPLIANCE_LOGGING:
  # Configuration for compliance and audit logging
  audit_requirements:
    pci_dss:
      enabled: false  # Enable if handling payment data
      fields: ["user_id", "action", "timestamp", "source_ip", "result"]
      retention: "1y"
    
    gdpr:
      enabled: true
      fields: ["user_id", "data_accessed", "purpose", "consent_given"]
      retention: "3y"
      right_to_erasure: true
    
    hipaa:
      enabled: false  # Enable if handling healthcare data
      fields: ["patient_id", "accessor", "data_type", "timestamp"]
      retention: "6y"
      encryption_required: true
  
  audit_event_types:
    user_authentication:
      events: ["login", "logout", "failed_login", "password_change"]
      retention: "7y"
      encryption: true
    
    data_access:
      events: ["read", "write", "delete", "export"]
      retention: "7y"
      encryption: true
    
    configuration_changes:
      events: ["create", "update", "delete"]
      retention: "7y"
      encryption: true