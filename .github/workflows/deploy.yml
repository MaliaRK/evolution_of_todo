name: Deploy Todo App to Kubernetes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

    - name: Run tests
      run: |
        python -m pytest tests/ -v

    - name: Run security scan
      run: |
        # Run security scanning tools
        bandit -r backend/src/
        # Add other security scans as needed

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig_staging
        export KUBECONFIG=./kubeconfig_staging
        kubectl cluster-info

    - name: Deploy to Staging with Helm
      run: |
        export KUBECONFIG=./kubeconfig_staging
        helm upgrade --install todo-app ./helm/todo-app \
          --values ./helm/todo-app/values-staging.yaml \
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ github.sha }} \
          --namespace todo-app --create-namespace

    - name: Run deployment validation
      run: |
        export KUBECONFIG=./kubeconfig_staging
        kubectl rollout status deployment/todo-app --namespace todo-app --timeout=300s

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency: production # Ensures only one deployment at a time
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig_prod
        export KUBECONFIG=./kubeconfig_prod
        kubectl cluster-info

    - name: Deploy to Production with Helm
      run: |
        export KUBECONFIG=./kubeconfig_prod
        helm upgrade --install todo-app ./helm/todo-app \
          --values ./helm/todo-app/values-prod.yaml \
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
          --set image.tag=${{ github.sha }} \
          --namespace todo-app --create-namespace

    - name: Run deployment validation
      run: |
        export KUBECONFIG=./kubeconfig_prod
        kubectl rollout status deployment/todo-app --namespace todo-app --timeout=600s

    - name: Post-deployment smoke test
      run: |
        export KUBECONFIG=./kubeconfig_prod
        # Add health check to ensure deployment is working
        kubectl get pods -n todo-app
        # Add actual health check calls to the service